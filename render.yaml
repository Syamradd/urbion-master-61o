services:
  - type: web
    name: urbion-master-61o
    runtime: python
    region: oregon
    plan: free
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn championship_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
