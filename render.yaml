services:

  - type: web
    name: urbion-master-61o-1
    runtime: python
    region: singapore
    plan: free
    autoDeployTrigger: checksPass

    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

    startCommand: python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:

      - key: PYTHON_VERSION
        value: 3.11
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
