services:

  - type: web
    name: urbion-api
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:

      - key: PYTHON_VERSION
        value: 3.11
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
