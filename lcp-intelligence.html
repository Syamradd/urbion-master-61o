<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URBION · LCP Intelligence</title><style>body{margin:0;background:#07121c;color:#eaf4fb;font:14px Inter,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px}.hero{padding:22px;border:1px solid #203b50;border-radius:18px;background:linear-gradient(135deg,#0d2235,#08131f)}h1{margin:0 0 6px;font-size:28px}.muted{color:#8fa7b7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.card{padding:16px;border:1px solid #203b50;border-radius:14px;background:#0b1926}.field{display:grid;gap:6px;margin-bottom:10px}label{font-size:11px;color:#9fb4c3}input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #29485e;border-radius:9px;background:#07121c;color:#eff8ff}button{padding:11px 15px;border:0;border-radius:10px;background:#21c7a0;color:#06151b;font-weight:900;cursor:pointer}.trace{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{padding:7px 9px;border:1px solid #28465a;border-radius:999px;font-size:10px}.ok{color:#5ee7c2}.warn{color:#ffc96b}.results{display:none}.metric{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #183044;font-size:11px}.metric:last-child{border:0}@media(max-width:760px){main{padding:14px}.grid{grid-template-columns:1fr}}</style><script src="/urbion_ui.js"></script></head><body><main><section class="hero"><h1>URBION · Integrated LCP Intelligence</h1><div class="muted">One evidence chain from site assessment to planner review.</div><div class="trace"><span class="chip">SITE</span><span>→</span><span class="chip">SPATIAL</span><span>→</span><span class="chip">STATION</span><span>→</span><span class="chip">IMPACT</span><span>→</span><span class="chip">POLICY / SDG</span><span>→</span><span class="chip">RECOMMENDATION</span><span>→</span><span class="chip">LCP REVIEW</span></div></section><section class="card" style="margin-top:14px"><div class="grid"><div><h3>Site & Development</h3><div class="field"><label>Site latitude</label><input id="site_lat" value="2.2"></div><div class="field"><label>Site longitude</label><input id="site_lon" value="102.25"></div><div class="field"><label>TOD latitude</label><input id="tod_lat" value="2.205"></div><div class="field"><label>TOD longitude</label><input id="tod_lon" value="102.255"></div><div class="field"><label>Development type</label><input id="development_type" value="Mixed Use"></div><div class="field"><label>Units</label><input id="units" value="120" type="number"></div><div class="field"><label>Site area (ha)</label><input id="site_area_ha" value="2" type="number"></div></div><div><h3>Evidence Inputs</h3><div class="field"><label>Road distance (m)</label><input id="road_distance_m" value="80" type="number"></div><div class="field"><label>Elevation (m)</label><input id="elevation_m" value="8" type="number"></div><div class="field"><label>Daily trips</label><input id="daily_trips" value="500" type="number"></div><div class="field"><label>Policy reference</label><input id="policy_reference" value="RT MBMB 2035"></div><div class="field"><label>Policy strategy</label><input id="policy_strategy" value="Review mitigation and planning controls"></div><div class="field"><label>SDG</label><input id="sdg" value="SDG 11"></div><button id="run">RUN LCP INTELLIGENCE</button><div id="status" class="muted" style="margin-top:10px"></div></div></div></section><section id="results" class="results"><div class="grid"><div class="card"><h3>Decision</h3><div id="decision"></div></div><div class="card"><h3>Evidence & Review</h3><div id="evidence"></div></div><div class="card"><h3>Impacts</h3><div id="impacts"></div></div><div class="card"><h3>Recommendations</h3><div id="recommendations"></div></div></div></section></main><script>const API=location.origin;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=id=>document.getElementById(id).value;document.getElementById('run').onclick=async()=>{const status=document.getElementById('status');status.textContent='Running deterministic LCP chain…';const body={assessment:{site_lat:+val('site_lat'),site_lon:+val('site_lon'),tod_lat:+val('tod_lat'),tod_lon:+val('tod_lon'),development_type:val('development_type'),development_class:'Mixed Use',state:'Melaka',district:'Melaka Tengah',pbt:'Majlis Bandaraya Melaka Bersejarah'},development_inputs:{development_type:val('development_type'),units:+val('units'),site_area_ha:+val('site_area_ha'),daily_trips:+val('daily_trips'),road_distance_m:+val('road_distance_m')},spatial_inputs:{road_distance_m:+val('road_distance_m'),elevation_m:+val('elevation_m')},policy_links:[{domain:'physical',impact:'Development impact',issue:'Planning mitigation',reference:val('policy_reference'),strategy:val('policy_strategy'),sdg:val('sdg')}],station_snapshot:{status:'NOT_PROVIDED',evidence:'UNVERIFIED'}};try{const r=await fetch(API+'/lcp/intelligence',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.detail?.message||'Request failed');document.getElementById('results').style.display='block';document.getElementById('decision').innerHTML='<div class="metric"><b>Status</b><span>'+esc(j.assessment.final_status)+'</span></div><div class="metric"><b>Confidence</b><span>'+esc(j.assessment.decision_confidence)+'</span></div><div class="metric"><b>Boundary</b><span>'+esc(j.decision_boundary)+'</span></div><div class="metric"><b>Trace</b><span>'+esc(j.trace)+'</span></div>';document.getElementById('evidence').innerHTML='<div class="metric"><b>Review gaps</b><span class="warn">'+esc(j.evidence_summary.review_gap_count)+'</span></div><div class="metric"><b>Calculated</b><span class="ok">'+esc(j.evidence_summary.counts.CALCULATED||0)+'</span></div><div class="metric"><b>Source context</b><span>'+esc(j.evidence_summary.counts.SOURCE_CONTEXT||0)+'</span></div><div class="metric"><b>Statutory verification</b><span>'+esc(j.statutory_verification)+'</span></div>';const im=j.development_impact.impacts;document.getElementById('impacts').innerHTML=['physical','social','economic'].map(d=>'<div class="metric"><b>'+esc(d.toUpperCase())+'</b><span>'+esc(im[d].length)+' metrics</span></div>').join('');const rec=j.recommendations.recommendations||[];document.getElementById('recommendations').innerHTML=rec.length?rec.map(x=>'<div class="metric"><b>'+esc(x.issue||x.domain)+'</b><span>'+esc(x.action)+'</span></div>').join(''):'<span class="warn">No traceable recommendation yet — policy evidence required.</span>';status.textContent='LCP intelligence complete · planner review boundary retained.'}catch(e){status.textContent='ERROR · '+esc(e.message)}};</script></body></html>
