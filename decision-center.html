<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URBION HORIZON — Decision Center</title><style>body{margin:0;background:#050a10;color:#eff8ff;font-family:Inter,system-ui,sans-serif}header{height:64px;border-bottom:1px solid #203343;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#07121c;gap:12px}b{letter-spacing:.08em}.brand{font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid #29445f;background:#0b1621;color:#b9cbd7;padding:9px 13px;border-radius:9px;cursor:pointer}.tabs button.active{background:#5ee7c2;color:#031017;border-color:#5ee7c2;font-weight:800}.status{font-size:11px;color:#8ea4b5;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5ee7c2;margin-right:7px}.frame{height:calc(100vh - 65px);width:100%;border:0;background:#050a10}.hint{position:fixed;bottom:12px;right:14px;background:#0b1621dd;border:1px solid #203343;padding:8px 10px;border-radius:8px;font-size:10px;color:#8ea4b5;z-index:5}</style></head><body><header><div class="brand">URBION HORIZON · DECISION CENTER</div><nav class="tabs"><button id="assess" class="active">01 · SITE ASSESSMENT</button><button id="map">02 · MAP STUDIO</button><button id="whatif">03 · WHAT-IF</button></nav><div id="health" class="status"><span class="dot"></span>Checking engine…</div></header><iframe id="frame" class="frame" src="index.html" title="URBION workspace"></iframe><div class="hint">Assessment → Map Studio → What-If → strongest pathway</div><script src="/urbion_ui.js"></script><script>const API=location.origin;const f=document.querySelector('#frame');const a=document.querySelector('#assess'),m=document.querySelector('#map'),w=document.querySelector('#whatif');function set(active,url){[a,m,w].forEach(x=>x.classList.remove('active'));({a,m,w}[active]).classList.add('active');f.src=url}a.onclick=()=>set('a','index.html');m.onclick=()=>set('m','map-studio.html');w.onclick=()=>set('w','what-if.html');fetch(API+'/health').then(r=>r.json()).then(j=>document.querySelector('#health').innerHTML='<span class="dot"></span>'+((j.status==='healthy')?(j.engine||'ENGINE ONLINE'):'ENGINE CHECK')).catch(()=>document.querySelector('#health').textContent='ENGINE OFFLINE');</script></body></html>
