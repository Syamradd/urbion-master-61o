<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URBION HORIZON — Decision Center</title><style>body{margin:0;background:#050a10;color:#eff8ff;font-family:Inter,system-ui,sans-serif}header{height:64px;border-bottom:1px solid #203343;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#07121c}b{letter-spacing:.08em}.brand{font-weight:800}.tabs{display:flex;gap:8px}.tabs button{border:1px solid #29445f;background:#0b1621;color:#b9cbd7;padding:9px 13px;border-radius:9px;cursor:pointer}.tabs button.active{background:#5ee7c2;color:#031017;border-color:#5ee7c2;font-weight:800}.status{font-size:11px;color:#8ea4b5}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5ee7c2;margin-right:7px}.frame{height:calc(100vh - 65px);width:100%;border:0;background:#050a10}.hint{position:fixed;bottom:12px;right:14px;background:#0b1621dd;border:1px solid #203343;padding:8px 10px;border-radius:8px;font-size:10px;color:#8ea4b5;z-index:5}</style></head><body><header><div class="brand">URBION HORIZON · DECISION CENTER</div><nav class="tabs"><button id="assess" class="active">01 · SITE ASSESSMENT</button><button id="whatif">02 · WHAT-IF</button></nav><div id="health" class="status"><span class="dot"></span>Checking engine…</div></header><iframe id="frame" class="frame" src="index.html" title="URBION workspace"></iframe><div class="hint">Assessment → What-If → strongest pathway</div><script>const f=document.querySelector('#frame');const a=document.querySelector('#assess'),w=document.querySelector('#whatif');function set(active,url){a.classList.toggle('active',active==='a');w.classList.toggle('active',active==='w');f.src=url}a.onclick=()=>set('a','index.html');w.onclick=()=>set('w','what-if.html');fetch('https://urbion-master-61o-1.onrender.com/health').then(r=>r.json()).then(j=>document.querySelector('#health').innerHTML='<span class="dot"></span>'+((j.status==='healthy')?'ENGINE ONLINE':'ENGINE CHECK')).catch(()=>document.querySelector('#health').textContent='ENGINE OFFLINE');</script></body></html>
