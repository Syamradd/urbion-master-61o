name: URBION One-Time GIS Repair
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
      - name: Patch JMG FeatureServer query path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('urbion_wms_proxy.py')
          s = p.read_text()
          old = '''    common = {\n        "where": "1=1", "outFields": "OBJECTID", "returnGeometry": "true",\n        "outSR": "3857", "geometryType": "esriGeometryEnvelope", "inSR": "3857",\n        "spatialRel": "esriSpatialRelEnvelopeIntersects", "geometry": json.dumps(envelope, separators=(",", ":")), "f": "json",\n    }\n    query = {**common, "resultRecordCount": "500", "returnExceededLimitFeatures": "true"}\n'''
          new = '''    common = {\n        "where": "1=1", "outFields": "OBJECTID", "returnGeometry": "true",\n        "outSR": "3857", "geometryType": "esriGeometryEnvelope", "inSR": "3857",\n        "spatialRel": "esriSpatialRelEnvelopeIntersects", "geometry": json.dumps(envelope, separators=(",", ":")), "f": "json",\n        "resultType": "tile",\n        "returnExceededLimitFeatures": "false",\n    }\n    query = {**common, "resultRecordCount": "500"}\n'''
          if old not in s:
              raise SystemExit('target JMG query block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python -m py_compile urbion_wms_proxy.py
          git diff --check
      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urbion_wms_proxy.py
          git commit -m "fix(gis): optimize JMG FeatureServer tile query" || exit 0
          git push origin HEAD:feature/canonical-workspace-v2