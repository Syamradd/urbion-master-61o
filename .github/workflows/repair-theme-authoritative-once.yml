name: One-time authoritative theme runtime repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch theme runtime and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('urbion_championship_horizon_ui.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* Authoritative theme click ownership v2 */'
          if marker not in s:
              guard = r'''

/* Authoritative theme click ownership v2 */
(()=>{
"use strict";
if(window.__URBION_AUTHORITATIVE_THEME_CLICK_V2__)return;
window.__URBION_AUTHORITATIVE_THEME_CLICK_V2__=true;
const apply=light=>{
  const html=document.documentElement;
  localStorage.setItem("urbion-theme",light?"light":"dark");
  html.classList.toggle("cs-light",light);
  const logo=document.querySelector("#cs-logo");
  if(logo)logo.src=light?"/urbion_logo_light.svg":"/urbion_logo_dark.svg";
};
apply(localStorage.getItem("urbion-theme")==="light");
document.addEventListener("click",event=>{
  const button=event.target?.closest?.("#cs-theme");
  if(!button)return;
  event.preventDefault();
  event.stopPropagation();
  event.stopImmediatePropagation();
  apply(!document.documentElement.classList.contains("cs-light"));
},true);
})();
'''
              p.write_text(s + guard, encoding='utf-8')
          else:
              print('Authoritative theme click ownership v2 already present; leaving runtime unchanged.')
          w = Path('.github/workflows/repair-theme-authoritative-once.yml')
          w.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urbion_championship_horizon_ui.js .github/workflows/repair-theme-authoritative-once.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(runtime): make theme click authoritative'
          git push origin HEAD:main