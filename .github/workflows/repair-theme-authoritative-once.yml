name: One-time authoritative theme runtime repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch theme runtime guard and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('urbion_championship_horizon_ui.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* Authoritative runtime theme observer v1 */'
          if marker not in s:
              guard = r'''

/* Authoritative runtime theme observer v1 */
(()=>{
"use strict";
if(window.__URBION_AUTHORITATIVE_THEME_GUARD__)return;
window.__URBION_AUTHORITATIVE_THEME_GUARD__=true;
const enforce=()=>{
  const html=document.documentElement;
  const light=localStorage.getItem("urbion-theme")==="light";
  if(html.classList.contains("cs-light")!==light)html.classList.toggle("cs-light",light);
  const logo=document.querySelector("#cs-logo");
  if(logo){const src=light?"/urbion_logo_light.svg":"/urbion_logo_dark.svg";if(logo.getAttribute("src")!==src)logo.setAttribute("src",src);}
};
enforce();
document.addEventListener("click",event=>{
  if(event.target?.closest?.("#cs-theme")){window.setTimeout(enforce,0);window.setTimeout(enforce,25);window.setTimeout(enforce,100);}
},true);
new MutationObserver(enforce).observe(document.documentElement,{attributes:true,attributeFilter:["class"]});
window.addEventListener("storage",enforce);
})();
'''
              p.write_text(s + guard, encoding='utf-8')
          else:
              print('Authoritative guard already present; leaving file unchanged.')
          w = Path('.github/workflows/repair-theme-authoritative-once.yml')
          w.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urbion_championship_horizon_ui.js .github/workflows/repair-theme-authoritative-once.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(runtime): make theme toggle authoritative'
          git push origin HEAD:main
