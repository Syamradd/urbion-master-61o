name: URBION One-Time JMG Repair

on:
  push:
    branches:
      - feature/canonical-workspace-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
          fetch-depth: 2

      - name: Apply minimal authoritative JMG repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("urbion_wms_proxy.py")
          s = p.read_text(encoding="utf-8")
          old_query = '''        "where": "1=1", "outFields": "OBJECTID,Line_code,Type,Name", "returnGeometry": "true",\n        "outSR": "3857", "geometryType": "esriGeometryEnvelope", "inSR": "3857",\n        "spatialRel": "esriSpatialRelIntersects", "geometry": json.dumps(envelope, separators=(",", ":")), "f": "json",'''
          new_query = '''        "where": "1=1", "outFields": "OBJECTID", "returnGeometry": "true",\n        "outSR": "3857", "geometryType": "esriGeometryEnvelope", "inSR": "3857",\n        "spatialRel": "esriSpatialRelEnvelopeIntersects", "geometry": json.dumps(envelope, separators=(",", ":")), "f": "json",'''
          old_order = '''    export_url = f"https://{match[0]}{parsed_path}/export"; last_detail = "no response"\n    try:\n        upstream = await _client_get(export_url, dict(params))'''
          new_order = '''    # Prefer the authoritative JMG FeatureServer geometry query for the\n    # Major Fault polyline layer; retain MapServer export as fallback.\n    if is_jmg and parsed_path in JMG_FEATURE_FALLBACKS:\n        fallback = await _jmg_feature_image_fallback(parsed_path, params)\n        if fallback is not None: return fallback\n\n    export_url = f"https://{match[0]}{parsed_path}/export"; last_detail = "no response"\n    try:\n        upstream = await _client_get(export_url, dict(params))'''
          old_tail = '''    if is_jmg and parsed_path in JMG_FEATURE_FALLBACKS:\n        fallback = await _jmg_feature_image_fallback(parsed_path, params)\n        if fallback is not None: return fallback\n    return _proxy_failure("Authoritative ArcGIS upstream render failed", last_detail)'''
          new_tail = '''    return _proxy_failure("Authoritative ArcGIS upstream render failed", last_detail)'''
          if old_query in s and old_order in s and old_tail in s:
              s = s.replace(old_query, new_query, 1)
              s = s.replace(old_order, new_order, 1)
              s = s.replace(old_tail, new_tail, 1)
              p.write_text(s, encoding="utf-8")
              print("JMG patch applied")
          else:
              print("JMG patch already applied or source shape changed; no-op")
          PY

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one_time_jmg_repair.yml
          git add urbion_wms_proxy.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix JMG Major Fault authoritative render path"
          git push origin HEAD:feature/canonical-workspace-v2
