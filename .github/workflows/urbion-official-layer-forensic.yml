name: URBION Official Layer Forensic

on:
  push:
    branches: [feature/champion-command-center-consolidation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-browser:
    name: forensic-browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Playwright
        run: python -m pip install playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Launch Render-equivalent Uvicorn command
        env:
          PYTHONPATH: tests:.
          PORT: 8765
        run: |
          set -euo pipefail
          python -m uvicorn championship_server:app --host 0.0.0.0 --port "$PORT" > /tmp/urbion-forensic-uvicorn.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then break; fi
            sleep 1
          done
          python tests/browser_official_layer_forensic.py 2>&1 | tee /tmp/urbion-official-layer-forensic.log
      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urbion-official-layer-forensic
          path: |
            /tmp/urbion-official-layer-forensic.log
            /tmp/urbion-forensic-uvicorn.log
          if-no-files-found: warn
