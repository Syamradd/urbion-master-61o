name: URBION One-Time Preflight Parallelization Repair
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'httpx<1.0,>=0.27'
      - name: Parallelize unchanged GIS preflight assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/gis_upstream_preflight.py')
          s = p.read_text()
          marker = 'def main() -> None:\n'
          if marker not in s:
              raise SystemExit('main marker not found')
          if 'URBION_PREFLIGHT_LAYER' in s:
              raise SystemExit('parallel preflight patch already present')
          block = '''def main() -> None:\n    selected = os.getenv("URBION_PREFLIGHT_LAYER")\n    if selected:\n        if selected not in LAYERS:\n            raise SystemExit(f"Unknown URBION_PREFLIGHT_LAYER: {selected}")\n    else:\n        import concurrent.futures\n        import subprocess\n        import sys\n        failures = []\n        max_workers = min(6, len(LAYERS))\n        with concurrent.futures.ThreadPoolExecutor(max_workers=max_workers) as pool:\n            futures = {\n                pool.submit(\n                    subprocess.run,\n                    [sys.executable, __file__],\n                    env={**os.environ, "URBION_PREFLIGHT_LAYER": layer},\n                    capture_output=True,\n                    text=True,\n                ): layer\n                for layer in LAYERS\n            }\n            ordered = {}\n            for future, layer in [(future, futures[future]) for future in futures]:\n                result = future.result()\n                ordered[layer] = result\n                if result.returncode != 0:\n                    failures.append(layer)\n            for layer in LAYERS:\n                result = ordered[layer]\n                print(f"\\n===== PREFLIGHT LAYER {layer} =====")\n                if result.stdout:\n                    print(result.stdout, end="")\n                if result.stderr:\n                    print(result.stderr, end="", file=sys.stderr)\n        if failures:\n            raise SystemExit("Parallel GIS preflight failures: " + ", ".join(failures))\n        print(f"Parallel GIS authoritative + proxy preflight: PASS · {len(LAYERS)}/{len(LAYERS)} layers")\n        return\n\n'''
          s = s.replace(marker, block, 1)
          old = '        for layer in LAYERS:\n'
          new = '        for layer in ([selected] if selected else LAYERS):\n'
          if old not in s:
              raise SystemExit('layer loop target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          python -m py_compile scripts/gis_upstream_preflight.py
          git diff --check
          grep -n "URBION_PREFLIGHT_LAYER\|ThreadPoolExecutor\|Parallel GIS authoritative" scripts/gis_upstream_preflight.py
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_preflight_parallelize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gis_upstream_preflight.py
          git commit -m "fix(gis): parallelize authoritative preflight layers"
          git push origin HEAD:feature/canonical-workspace-v2
