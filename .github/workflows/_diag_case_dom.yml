name: diag-case-dom
on:
  push:
    branches: [fix/horizon-visual-rebase]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horizon-visual-rebase
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runtime DOM diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt playwright >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
          python -m uvicorn championship_server:app --host 0.0.0.0 --port 8765 >/tmp/diag.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1 && break; sleep 1; done
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          base='http://127.0.0.1:8765/'
          with sync_playwright() as pw:
            b=pw.chromium.launch()
            p=b.new_page(viewport={'width':1440,'height':900})
            errs=[]; pes=[]; req=[]
            p.on('console',lambda m: errs.append((m.type,m.text)) if m.type=='error' else None)
            p.on('pageerror',lambda e: pes.append(str(e)))
            p.on('requestfailed',lambda r: req.append((r.url,r.failure)))
            p.goto(base,wait_until='networkidle',timeout=30000)
            print('URL',p.url); print('TITLE',p.title())
            print('IDS_WITH_PROJECT',p.evaluate("Array.from(document.querySelectorAll('[id]')).map(e=>e.id).filter(x=>x.toLowerCase().includes('project'))"))
            print('FORMS',p.evaluate("Array.from(document.querySelectorAll('input,select,textarea')).map(e=>({tag:e.tagName,id:e.id,name:e.name,type:e.type,value:e.value,placeholder:e.placeholder})).slice(0,60)"))
            print('MATCH_PROJECT_TEXT',p.evaluate("Array.from(document.querySelectorAll('*')).filter(e=>(e.textContent||'').trim()==='Site / Project Full Name').slice(0,5).map(e=>({tag:e.tagName,id:e.id,cls:e.className,html:e.parentElement?.outerHTML?.slice(0,2500)}))"))
            print('CS_PROJECT',p.locator('#cs-project_name').count())
            print('CS_CONTENT_HTML',p.locator('#cs-content').inner_html()[:12000])
            print('CONSOLE',errs); print('PAGE_ERRORS',pes); print('REQUEST_FAILURES',req)
            b.close()
          PY
      - name: Remove diagnostic workflow
        if: always()
        run: |
          rm -f .github/workflows/_diag_case_dom.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/_diag_case_dom.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: remove temporary case DOM diagnostic'
          git push origin HEAD:fix/horizon-visual-rebase
