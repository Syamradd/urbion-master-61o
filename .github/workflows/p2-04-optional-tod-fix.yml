name: P2-04 optional TOD contract fix
on:
  push:
    branches:
      - fix/p2-04-futuristic-visual-identity
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch optional TOD backend contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('server.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              (
                  " site_lat:float=Field(...,ge=-90,le=90);site_lon:float=Field(...,ge=-180,le=180);tod_lat:float=Field(...,ge=-90,le=90);tod_lon:float=Field(...,ge=-180,le=180);",
                  " site_lat:float=Field(...,ge=-90,le=90);site_lon:float=Field(...,ge=-180,le=180);tod_lat:float|None=Field(default=None,ge=-90,le=90);tod_lon:float|None=Field(default=None,ge=-180,le=180);",
              ),
              (
                  "def classify(d):return'TOD 400m'if d<=400 else('TOD 800m'if d<=800 else'OUTSIDE TOD 800m')",
                  "def classify(d):return'NO TOD DISTANCE'if d is None else('TOD 400m'if d<=400 else('TOD 800m'if d<=800 else'OUTSIDE TOD 800m'))",
              ),
              (
                  "def _validate_spatial_input(r):\n values=(r.site_lat,r.site_lon,r.tod_lat,r.tod_lon)\n if not all(math.isfinite(float(value)) for value in values):raise HTTPException(status_code=422,detail={'code':'INVALID_SPATIAL_INPUT','message':'Site and TOD coordinates must be finite numeric values.'})\n if (float(r.site_lat),float(r.site_lon))==(-90.0,-180.0)or(float(r.tod_lat),float(r.tod_lon))==(-90.0,-180.0):raise HTTPException(status_code=422,detail={'code':'INVALID_SPATIAL_INPUT','message':'Placeholder coordinates (-90, -180) cannot be used for spatial assessment. Provide actual site and TOD coordinates.'})",
                  "def _validate_spatial_input(r):\n site_values=(r.site_lat,r.site_lon)\n if not all(math.isfinite(float(value)) for value in site_values):raise HTTPException(status_code=422,detail={'code':'INVALID_SPATIAL_INPUT','message':'Site coordinates must be finite numeric values.'})\n if (float(r.site_lat),float(r.site_lon))==(-90.0,-180.0):raise HTTPException(status_code=422,detail={'code':'INVALID_SPATIAL_INPUT','message':'Placeholder site coordinates (-90, -180) cannot be used for spatial assessment. Provide actual site coordinates.'})\n tod_values=(r.tod_lat,r.tod_lon)\n if (r.tod_lat is None)!=(r.tod_lon is None):raise HTTPException(status_code=422,detail={'code':'INCOMPLETE_SPATIAL_INPUT','message':'Provide both TOD coordinates, or leave both TOD fields blank.'})\n if r.tod_lat is not None and not all(math.isfinite(float(value)) for value in tod_values):raise HTTPException(status_code=422,detail={'code':'INVALID_SPATIAL_INPUT','message':'TOD coordinates must be finite numeric values.'})\n if r.tod_lat is not None and (float(r.tod_lat),float(r.tod_lon))==(-90.0,-180.0):raise HTTPException(status_code=422,detail={'code':'INVALID_SPATIAL_INPUT','message':'Placeholder TOD coordinates (-90, -180) cannot be used for spatial assessment. Provide actual TOD coordinates.'})",
              ),
              (
                  "def assess_core(r):\n _validate_spatial_input(r);d=distance_m(r.site_lat,r.site_lon,r.tod_lat,r.tod_lon);cl=classify(d);dc=normalise_class(r.development_type,r.development_class);cov=policy_coverage(r.pbt);sc=urbion_create_spatial_context(precinct=r.precinct,precinct_verified=False,tod_verified=d<=800,tod_400_verified=d<=400,tod_800_verified=d<=800,shop_frontage_verified=r.shop_frontage_verified,shop_office_verified=r.shop_office_verified,tod_distance_m=d);",
                  "def assess_core(r):\n _validate_spatial_input(r);d=distance_m(r.site_lat,r.site_lon,r.tod_lat,r.tod_lon) if r.tod_lat is not None else None;cl=classify(d);dc=normalise_class(r.development_type,r.development_class);cov=policy_coverage(r.pbt);sc=urbion_create_spatial_context(precinct=r.precinct,precinct_verified=False,tod_verified=d is not None and d<=800,tod_400_verified=d is not None and d<=400,tod_800_verified=d is not None and d<=800,shop_frontage_verified=r.shop_frontage_verified,shop_office_verified=r.shop_office_verified,tod_distance_m=d);",
              ),
              (
                  "'evidence_state':{'site_coordinates':evidence_state(user_provided=True),'tod_distance':evidence_state(calculated=True),'planning_rules':",
                  "'evidence_state':{'site_coordinates':evidence_state(user_provided=True),'tod_distance':evidence_state(calculated=True) if d is not None else evidence_state(),'planning_rules':",
              ),
          ]
          for old,new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match, found {s.count(old)} for: {old[:80]}')
              s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile server.py
          git diff --check
          git diff -- server.py
      - name: Commit backend contract fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/p2-04-optional-tod-fix.yml
          git add server.py .github/workflows/p2-04-optional-tod-fix.yml
          git commit -m "fix: allow omitted TOD reference in assessment contract"
          git push origin HEAD:fix/p2-04-futuristic-visual-identity
