name: P2-03 Safe Apply
on:
  push:
    branches: [fix/p2-03-layer-state-clarity]
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'P2-03 applied')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P2-03
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('urbion_championship_command_shell.js')
          s=p.read_text(encoding='utf-8')
          a=s.index('function layerUI(){')
          b=s.index('function ui(){',a)
          block=s[a:b]
          assert 'layer-status-key' not in block
          block=block.replace("</div>'+GROUPS", "</div><div class=\"layer-status-key\"><span class=\"off\">OFF</span><span class=\"live\">LIVE</span><span class=\"query\">QUERY</span><span class=\"gap\">GAP</span></div>'+GROUPS",1)
          s=s[:a]+block+s[b:]
          a=s.index('function setLayerState(idv,text){')
          b=s.index('function toggleLayer',a)
          new="function setLayerState(idv,text){const row=$(`[data-layer=\"${idv}\"]`)?.closest('.fcc-layer-row');const sm=row?.querySelector('span small');if(sm)sm.textContent=text;if(row){row.classList.remove('is-live','is-query','is-error','is-gap','is-off');const n=String(text||'').toUpperCase();const checked=!!row.querySelector('input[type=\"checkbox\"]')?.checked;if(!checked)row.classList.add('is-off');if(n.includes('LIVE'))row.classList.add('is-live');else if(n.includes('QUERY')||n.includes('RUN ANALYSIS')||n.includes('LOADING'))row.classList.add('is-query');else if(n.includes('ERROR'))row.classList.add('is-error');else if(n.includes('NO FEATURE')||n.includes('UNAVAILABLE')||n.includes('REQUIRED'))row.classList.add('is-gap');}}"
          s=s[:a]+new+s[b:]
          marker="`;document.head.appendChild(s)}"
          assert marker in s
          css="/* PHASE 2 P2-03 — LAYER STATE CLARITY */ .layer-drawer{width:252px;max-height:570px}.layer-status-key{display:flex;gap:5px;padding:7px 2px;border-bottom:1px solid #1a3441}.layer-status-key span{padding:3px 5px;border:1px solid #24414d;border-radius:5px;font-size:5px;font-weight:900;letter-spacing:.08em}.layer-status-key .off{color:#70838c}.layer-status-key .live{color:var(--mint);border-color:rgba(95,229,197,.2)}.layer-status-key .query{color:var(--amber);border-color:rgba(255,191,115,.22)}.layer-status-key .gap{color:var(--red);border-color:rgba(255,124,117,.18)}.fcc-layer-row{grid-template-columns:16px minmax(0,1fr) 42px;padding:6px}.fcc-layer-row span{min-width:0}.fcc-layer-row.is-off{opacity:.72}.fcc-layer-row.is-on{box-shadow:inset 2px 0 0 var(--mint)}.fcc-layer-row.is-live span small{color:var(--mint)}.fcc-layer-row.is-query span small{color:var(--amber);animation:layerPulse 1.1s ease-in-out infinite}.fcc-layer-row.is-error span small{color:var(--red)}.fcc-layer-row.is-gap span small{color:#9aaab0}@keyframes layerPulse{50%{opacity:.42}}"
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check urbion_championship_command_shell.js
          git diff --check
          test "$(git diff --name-only)" = "urbion_championship_command_shell.js"
          grep -q 'PHASE 2 P2-03' urbion_championship_command_shell.js
      - name: Commit P2-03
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urbion_championship_command_shell.js
          git commit -m 'style: P2-03 applied'
          git push origin HEAD:fix/p2-03-layer-state-clarity
