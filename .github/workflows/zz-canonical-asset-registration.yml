name: URBION One-Shot Canonical Asset Registration

on:
  push:
    branches:
      - feature/championship-convergence-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'chore: register canonical P1-P4 assets' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical asset registration
        shell: python
        run: |
          from pathlib import Path
          p = Path('landing_server.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('WORKSPACE_STATION_MAP = BASE_DIR / "urbion_workspace_station_map_owner.js"\n',
                        'WORKSPACE_STATION_MAP = BASE_DIR / "urbion_workspace_station_map_owner.js"\n'
                        'WORKSPACE_JUDGE_OWNER = BASE_DIR / "urbion_workspace_judge_owner_v1.js"\n'
                        'WORKSPACE_DECISION_STORY_V2 = BASE_DIR / "urbion_workspace_decision_story_owner_v2.js"\n'
                        'WORKSPACE_LIVE_EVIDENCE = BASE_DIR / "urbion_workspace_live_evidence_owner_v1.js"\n')
          s = s.replace('WORKSPACE_ROAD_INTELLIGENCE, WORKSPACE_ANALYSIS_SUMMARY, WORKSPACE_STATION_MAP)\n',
                        'WORKSPACE_ROAD_INTELLIGENCE, WORKSPACE_ANALYSIS_SUMMARY, WORKSPACE_STATION_MAP,\n'
                        '                WORKSPACE_JUDGE_OWNER, WORKSPACE_DECISION_STORY_V2, WORKSPACE_LIVE_EVIDENCE)\n')
          s = s.replace('<script src="/urbion_workspace_analysis_summary_owner.js"></script>\'\n               \'<script src="/urbion_workspace_station_map_owner.js"></script>',
                        '<script src="/urbion_workspace_analysis_summary_owner.js"></script>\'\n               \'<script src="/urbion_workspace_judge_owner_v1.js"></script>\'\n               \'<script src="/urbion_workspace_decision_story_owner_v2.js"></script>\'\n               \'<script src="/urbion_workspace_live_evidence_owner_v1.js"></script>\'\n               \'<script src="/urbion_workspace_station_map_owner.js"></script>')
          s = s.replace('"/urbion_workspace_station_map_owner.js": (WORKSPACE_STATION_MAP,"URBION HORIZON station map owner missing."),\n',
                        '"/urbion_workspace_station_map_owner.js": (WORKSPACE_STATION_MAP,"URBION HORIZON station map owner missing."),\n'
                        '        "/urbion_workspace_judge_owner_v1.js": (WORKSPACE_JUDGE_OWNER,"URBION HORIZON judge owner missing."),\n'
                        '        "/urbion_workspace_decision_story_owner_v2.js": (WORKSPACE_DECISION_STORY_V2,"URBION HORIZON decision story owner missing."),\n'
                        '        "/urbion_workspace_live_evidence_owner_v1.js": (WORKSPACE_LIVE_EVIDENCE,"URBION HORIZON live evidence owner missing."),\n')
          if 'WORKSPACE_JUDGE_OWNER' not in s or '/urbion_workspace_live_evidence_owner_v1.js' not in s:
              raise SystemExit('landing_server patch did not apply cleanly')
          p.write_text(s, encoding='utf-8')

          q = Path('urbion_workspace_station_map_owner.js')
          t = q.read_text(encoding='utf-8')
          a = t.find('function loadOwners(){')
          b = t.find('function boot(){', a)
          if a >= 0 and b > a:
              t = t[:a] + t[b:]
          t = t.replace('loadOwners();structuralLocation();','structuralLocation();')
          q.write_text(t, encoding='utf-8')
      - name: Verify syntax and explicit asset contract
        run: |
          python -m py_compile landing_server.py
          python - <<'PY'
          from pathlib import Path
          s=Path('landing_server.py').read_text()
          for x in ['WORKSPACE_JUDGE_OWNER','WORKSPACE_DECISION_STORY_V2','WORKSPACE_LIVE_EVIDENCE',
                    '/urbion_workspace_judge_owner_v1.js','/urbion_workspace_decision_story_owner_v2.js','/urbion_workspace_live_evidence_owner_v1.js']:
              assert x in s, x
          t=Path('urbion_workspace_station_map_owner.js').read_text()
          assert 'function loadOwners()' not in t
          print('CANONICAL ASSET REGISTRATION CONTRACT PASS')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing_server.py urbion_workspace_station_map_owner.js
          git commit -m 'chore: register canonical P1-P4 assets'
          git push
