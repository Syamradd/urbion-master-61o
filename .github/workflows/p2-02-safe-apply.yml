name: P2-02 Safe Apply

on:
  push:
    branches:
      - fix/p2-02-header-action-hierarchy

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply CSS-only header and action hierarchy patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('urbion_championship_command_shell.js')
          text=p.read_text(encoding='utf-8')
          marker='/* PHASE 2 P2-02 — HEADER + ACTION HIERARCHY */'
          assert text.count(marker)==0, 'P2-02 patch already present'
          needle="s.textContent=`"
          assert text.count(needle)==1, f'Expected exactly one canonical style template, found {text.count(needle)}'
          css="""/* PHASE 2 P2-02 — HEADER + ACTION HIERARCHY */
          .topbar{height:62px;padding:0 20px}
          .identity{gap:10px}
          .identity img{width:170px;max-height:38px}
          .identity>div:nth-child(2){padding-left:11px}
          .identity strong{font-size:14px}
          .institution{font-size:8px;margin-left:8px;padding-left:9px}
          .top-actions{gap:6px}
          .top-actions .system{margin-right:4px}
          #cs-lang,#cs-theme{min-width:30px;padding:6px 8px;border-radius:8px}
          .top-actions button[data-tool]{padding:7px 10px;border-radius:8px;border:1px solid rgba(105,211,210,.12);background:rgba(7,20,29,.55);color:#9fb5bd}
          .top-actions button[data-tool]:hover{border-color:rgba(105,211,210,.28);background:rgba(10,28,40,.75);color:#e8f7f8}
          .main-nav{min-height:42px;padding:0 20px}
          .main-nav .nav-link{padding:8px 10px;border-radius:8px}
          .main-nav .nav-link.active{background:rgba(74,216,212,.10);border-color:rgba(74,216,212,.18)}
          .main-nav .utility{padding:7px 9px;border-radius:8px}
          .workspace-head{padding-top:16px;padding-bottom:12px}
          .workspace-actions .primary{min-width:188px;padding:10px 15px}
          .workspace-actions .primary:disabled{opacity:.58}
          .cs-light .topbar{background:rgba(248,252,253,.94)}
          .cs-light .top-actions button[data-tool]{background:rgba(255,255,255,.78);border-color:#d7e5e9;color:#5d7380}
          .cs-light .top-actions button[data-tool]:hover{background:#fff;border-color:#bfd6dd;color:#17303a}
          .cs-light .main-nav .nav-link.active{background:rgba(51,190,193,.09);border-color:#c4dce2}
          """
          css=' '.join(line.strip() for line in css.splitlines())+' '
          text=text.replace(needle, needle+css, 1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate syntax and scope
        shell: bash
        run: |
          set -euo pipefail
          node --check urbion_championship_command_shell.js
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "urbion_championship_command_shell.js"
          grep -q 'PHASE 2 P2-02 — HEADER + ACTION HIERARCHY' urbion_championship_command_shell.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urbion_championship_command_shell.js
          git commit -m 'style: apply P2-02 header and action hierarchy'
          git push origin HEAD
