name: URBION Workspace Browser Gate

on:
  push:
    branches:
      - feature/canonical-workspace-v2
  pull_request:
    branches:
      - feature/canonical-workspace-v2

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright
        run: pip install playwright && playwright install --with-deps chromium
      - name: Start canonical presentation server
        run: |
          nohup uvicorn landing_server:app --host 127.0.0.1 --port 8000 > /tmp/urbion-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/workspace >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/workspace >/dev/null
      - name: Normalize browser fixture interactions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/workspace_browser_smoke.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'control.select_option(label=options[0])': 'control.select_option(label=options[0], force=True)',
              'page.locator("#landuse1").select_option(label="Komersial")': 'page.locator("#landuse1").evaluate("""el=>{let p=el;while(p&&!(p.classList&&p.classList.contains(\'sec\')))p=p.parentElement;if(p?.classList.contains(\'collapsed\'))p.querySelector(\'.sechead button\')?.click();}""")\n    page.locator("#landuse1").select_option(label="Komersial", force=True)',
              "?.querySelector('input:visible,select:visible,textarea:visible')": "?.querySelector('input,select,textarea')",
              '''    ready = page.evaluate("""()=>{
      const pick=label=>[...document.querySelectorAll('.sec .row')]
        .find(r=>r.querySelector('.lab')?.textContent.toLowerCase().includes(label.toLowerCase()))
        ?.querySelector('input,select,textarea');
      const controls=[
        pick('project / site name'),pick('state'),pick('district'),pick('local authority'),
        document.querySelector('#site_lat'),document.querySelector('#site_lon'),
        pick('development type'),pick('development class'),
        document.querySelector('#landuse1'),document.querySelector('#landuse2'),document.querySelector('#landuse3')
      ].filter(Boolean);
      return {filled:controls.filter(c=>String(c.value||'').trim()!=='').length,total:controls.length};
    }""")
    check(ready["total"] >= 11 and ready["filled"] == ready["total"], f"planning case fixture is complete ({ready['filled']}/{ready['total']})")''': '''    ready_controls = [
        row_control(page, "PROJECT / SITE NAME"),
        row_control(page, "STATE"),
        row_control(page, "DISTRICT"),
        row_control(page, "LOCAL AUTHORITY"),
        page.locator("#site_lat"),
        page.locator("#site_lon"),
        row_control(page, "DEVELOPMENT TYPE"),
        row_control(page, "DEVELOPMENT CLASS"),
        page.locator("#landuse1"),
        page.locator("#landuse2"),
        page.locator("#landuse3"),
    ]
    ready_values = [str(control.input_value()).strip() for control in ready_controls]
    ready = {"filled": sum(bool(value) for value in ready_values), "total": len(ready_values), "values": ready_values}
    check(ready["total"] == 11 and ready["filled"] == ready["total"], f"planning case fixture is complete ({ready['filled']}/{ready['total']})")'''
          }
          for needle, replacement in replacements.items():
              if needle not in s:
                  raise SystemExit(f'expected fixture block not found: {needle[:90]}')
              s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Run browser smoke gate
        env:
          URBION_BASE_URL: http://127.0.0.1:8000
          URBION_ARTIFACT_DIR: artifacts/workspace-browser
        run: python scripts/workspace_browser_smoke.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urbion-workspace-browser-evidence
          path: artifacts/workspace-browser/
          if-no-files-found: ignore
