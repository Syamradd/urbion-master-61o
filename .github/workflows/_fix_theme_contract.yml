name: URBION One-Time Theme Contract Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch HORIZON theme contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('urbion_championship_horizon_ui.js')
          text = path.read_text(encoding='utf-8')
          anchor = "function observe(){const root=$('#urbion-championship-shell');if(!root)return;const mo=new MutationObserver(()=>{enhanceNav();fixLayerDrawer();addMapHud()});mo.observe(root,{subtree:true,childList:true});setInterval(()=>{enhanceNav();fixLayerDrawer();},1500)}"
          if anchor not in text:
              raise SystemExit('Theme patch anchor not found')
          patch = anchor + "\nfunction syncThemeContract(){const h=document.documentElement,b=document.body,btn=$('#cs-theme');if(!btn||btn.dataset.urbionThemeBound==='1')return;btn.dataset.urbionThemeBound='1';const sync=()=>{const light=h.classList.contains('cs-light');b?.classList.toggle('cs-light',light);window.__URBION_THEME_LIGHT__=light};sync();btn.addEventListener('click',()=>setTimeout(()=>{const next=!h.classList.contains('cs-light');h.classList.toggle('cs-light',next);b?.classList.toggle('cs-light',next);window.__URBION_THEME_LIGHT__=next},0))}"
          text = text.replace(anchor, patch, 1)
          old = "addStyle();addVisual();enhanceNav();addStatus();fixLayerDrawer();addMapHud();observe();"
          new = "addStyle();addVisual();enhanceNav();addStatus();fixLayerDrawer();addMapHud();observe();syncThemeContract();"
          if old not in text:
              raise SystemExit('Theme boot anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_fix_theme_contract.yml
          git add urbion_championship_horizon_ui.js
          git commit -m "fix(ui): synchronize HORIZON light theme contract"
          git push origin HEAD:main
