name: fix-horizon-pointer-stack
on:
  push:
    branches: [fix/horizon-visual-rebase]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horizon-visual-rebase
          fetch-depth: 0
      - name: Fix pointer stacking
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('urbion_championship_horizon_ui.js')
          s=p.read_text(encoding='utf-8')
          marker='/* HORIZON POINTER STACK SAFETY */'
          if marker not in s:
              insert='''\n/* HORIZON POINTER STACK SAFETY */\nbody.horizon-ui .main-nav{position:relative!important;z-index:5!important;isolation:auto!important}\nbody.horizon-ui #cs-run,body.horizon-ui .run,body.horizon-ui button.run{position:relative!important;z-index:20!important;pointer-events:auto!important}\nbody.horizon-ui .hero-card,body.horizon-ui .case-panel,body.horizon-ui .map-panel-canonical,body.horizon-ui .intel-panel{position:relative!important;z-index:3!important}\nbody.horizon-ui .main-nav button.utility{position:relative!important;z-index:5!important}\n@media(max-width:1100px){body.horizon-ui #cs-run,body.horizon-ui .run,body.horizon-ui button.run{z-index:30!important}}\n'''
              token='`;'\n              if token not in s:
                  raise SystemExit('style terminator not found')
              s=s.replace(token, insert+token, 1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/_fix_horizon_pointer_stack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urbion_championship_horizon_ui.js .github/workflows/_fix_horizon_pointer_stack.yml
          git commit -m "fix(ui): prevent nav pointer interception"
          git push origin HEAD:fix/horizon-visual-rebase
