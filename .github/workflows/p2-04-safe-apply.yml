name: P2-04 Safe Apply
on:
  push:
    branches:
      - fix/p2-04-futuristic-visual-identity
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2-04-futuristic-visual-identity
          fetch-depth: 0
      - name: Apply P2-04 CSS
        shell: python
        run: |
          from pathlib import Path
          p=Path('urbion_championship_command_shell.js')
          s=p.read_text()
          anchor="s.textContent=`"
          css="""/* PHASE 2 P2-04 — FUTURISTIC VISUAL IDENTITY */\nbody, #urbion-championship-shell{background:#020b13;position:relative}\n#urbion-championship-shell::before{content:\"\";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 16% 18%,rgba(52,210,226,.14) 0 1px,transparent 2px),radial-gradient(circle at 72% 14%,rgba(93,180,255,.12) 0 1px,transparent 2px),radial-gradient(circle at 88% 42%,rgba(60,229,218,.10) 0 1.5px,transparent 2.5px),radial-gradient(circle at 28% 78%,rgba(72,157,255,.10) 0 1px,transparent 2px),radial-gradient(circle at 62% 84%,rgba(43,220,214,.09) 0 1px,transparent 2px),linear-gradient(180deg,rgba(2,16,28,.18),rgba(2,8,14,.54));background-size:170px 170px,220px 220px,260px 260px,210px 210px,190px 190px,100% 100%;mix-blend-mode:screen;opacity:.75}\n#urbion-championship-shell::after{content:\"\";position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(180deg,transparent 0 68%,rgba(9,35,49,.34) 100%),repeating-linear-gradient(90deg,transparent 0 9%,rgba(73,175,204,.035) 9.1%,transparent 9.2% 18%),repeating-linear-gradient(0deg,transparent 0 15%,rgba(73,175,204,.025) 15.1%,transparent 15.2% 30%);mask-image:linear-gradient(180deg,transparent 0%,black 36%,black 100%);opacity:.7}\n.topbar,.main-nav,.app-shell,.footer,#cs-overlay,#cs-toast{position:relative;z-index:1}\n.app-shell{overflow:hidden}\n.workstation{position:relative;isolation:isolate}\n.workstation::after{content:\"\";position:absolute;left:6%;right:6%;bottom:-28px;height:110px;pointer-events:none;background:linear-gradient(180deg,rgba(4,31,44,0),rgba(27,122,147,.08),rgba(5,16,25,0));clip-path:polygon(0 100%,0 82%,7% 82%,7% 52%,12% 52%,12% 72%,18% 72%,18% 40%,23% 40%,23% 66%,29% 66%,29% 48%,35% 48%,35% 26%,40% 26%,40% 61%,46% 61%,46% 34%,53% 34%,53% 58%,58% 58%,58% 20%,63% 20%,63% 66%,69% 66%,69% 44%,76% 44%,76% 58%,82% 58%,82% 31%,88% 31%,88% 70%,94% 70%,94% 48%,100% 48%,100% 100%);filter:drop-shadow(0 0 12px rgba(50,207,214,.08));opacity:.75}\n.cs-light body,.cs-light #urbion-championship-shell{background:#edf5f7}\n.cs-light #urbion-championship-shell::before{background:radial-gradient(circle at 14% 18%,rgba(49,164,184,.12) 0 1px,transparent 2px),radial-gradient(circle at 78% 22%,rgba(87,144,199,.10) 0 1px,transparent 2px),linear-gradient(180deg,rgba(255,255,255,.3),rgba(236,244,247,.55));mix-blend-mode:multiply;opacity:.55}\n.cs-light #urbion-championship-shell::after{opacity:.28}\n"""
          if anchor not in s: raise SystemExit('P2-04 anchor missing')
          if 'PHASE 2 P2-04 — FUTURISTIC VISUAL IDENTITY' in s: raise SystemExit('P2-04 already applied')
          s=s.replace(anchor,anchor+css,1)
          p.write_text(s)
      - name: Validate
        shell: bash
        run: |
          node --check urbion_championship_command_shell.js
          git diff --check
          grep -q 'PHASE 2 P2-04 — FUTURISTIC VISUAL IDENTITY' urbion_championship_command_shell.js
      - name: Commit and push
        shell: bash
        run: |
          git rm -f .github/workflows/p2-04-safe-apply.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urbion_championship_command_shell.js
          git commit -m 'style: apply P2-04 futuristic visual identity'
          git push origin HEAD:fix/p2-04-futuristic-visual-identity
