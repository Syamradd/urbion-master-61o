name: One-time Runtime Theme Guard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final theme runtime guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('urbion_championship_horizon_ui.js')
          s = p.read_text(encoding='utf-8')
          marker = "window.__URBION_HORIZON_THEME_RUNTIME_GUARD__=true;"
          if marker in s:
              print('Runtime theme guard already present.')
              raise SystemExit(0)
          guard = r'''
/* Final runtime theme guard: re-assert persisted theme after any competing button handler. */
(()=>{
'use strict';
if(window.__URBION_HORIZON_THEME_RUNTIME_GUARD__)return;
window.__URBION_HORIZON_THEME_RUNTIME_GUARD__=true;
const apply=()=>{
  const html=document.documentElement;
  const stored=localStorage.getItem('urbion-theme');
  const light=stored==='light';
  html.classList.toggle('cs-light',light);
  const logo=document.querySelector('#cs-logo');
  if(logo)logo.src=light?'/urbion_logo_light.svg':'/urbion_logo_dark.svg';
};
apply();
document.addEventListener('click',event=>{
  const button=event.target?.closest?.('#cs-theme');
  if(!button)return;
  window.setTimeout(apply,0);
},false);
})();
'''
          idx = s.rfind('})();')
          if idx < 0:
              raise SystemExit('HORIZON UI IIFE terminator not found')
          s = s[:idx+5] + '\n' + guard + s[idx+5:]
          p.write_text(s, encoding='utf-8')
          print('Applied final runtime theme guard.')
          PY
      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urbion_championship_horizon_ui.js
          git rm .github/workflows/repair-theme-runtime-once.yml
          git commit -m 'fix(runtime): enforce persisted theme after toggle'
          git push origin HEAD:main
