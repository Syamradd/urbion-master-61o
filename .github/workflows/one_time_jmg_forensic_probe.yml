name: URBION One-Time JMG Forensic Probe
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install httpx
        run: python -m pip install 'httpx<1.0,>=0.27'
      - name: Probe authoritative JMG services and canonical proxy variants
        env:
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import math, json, httpx
          from urllib.parse import urlencode

          WORLD=20037508.342789244
          lon,lat,z=102.196,2.285,13
          n=2**z
          x=int((lon+180)/360*n)
          y=int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n)
          s=2*WORLD/(256*n)
          bbox=(-WORLD+x*256*s, WORLD-(y+1)*256*s, -WORLD+(x+1)*256*s, WORLD-y*256*s)
          bbox_s=','.join(f'{v:.9f}' for v in bbox)
          print('JMG FORENSIC TILE',z,x,y,bbox_s)
          H={'User-Agent':'URBION-JMG-FORENSIC/1.0','Referer':'https://mygems.jmg.gov.my/','Accept':'image/png,image/*,application/json,*/*;q=0.8','Connection':'close'}
          with httpx.Client(timeout=httpx.Timeout(30.0,connect=8.0),follow_redirects=True,headers=H) as c:
              services=[
                ('fault-map','https://mygems.jmg.gov.my/server/rest/services/GeologiAsas/Major_Fault/MapServer/export',{'bbox':bbox_s,'bboxSR':'3857','imageSR':'3857','size':'256,256','dpi':'96','format':'png32','transparent':'true','f':'image','layers':'show:5'}),
                ('quarry-map','https://mygems.jmg.gov.my/server/rest/services/LombongKuari/Lombong_Kuari_Awam/MapServer/export',{'bbox':bbox_s,'bboxSR':'3857','imageSR':'3857','size':'256,256','dpi':'96','format':'png32','transparent':'true','f':'image','layers':'show:0'}),
              ]
              for name,url,p in services:
                  try:
                      r=c.get(url,params=p)
                      print(f'DIRECT {name}: HTTP={r.status_code} CT={r.headers.get("content-type","")} bytes={len(r.content)} URL={r.url}')
                      if not r.headers.get('content-type','').lower().startswith('image/'):
                          print('BODY',r.text[:1200].replace('\\n',' ').replace('\\r',' '))
                  except Exception as e: print('DIRECT',name,'ERROR',type(e).__name__,e)
              queries=[
                ('fault-query','https://mygems.jmg.gov.my/server/rest/services/GeologiAsas/Major_Fault/FeatureServer/5/query',{'where':'1=1','outFields':'OBJECTID,Line_code,Type,Name','returnGeometry':'true','outSR':'3857','resultRecordCount':'500','f':'json','geometry':bbox_s,'geometryType':'esriGeometryEnvelope','inSR':'3857','spatialRel':'esriSpatialRelIntersects','resultType':'tile','returnExceededLimitFeatures':'true'}),
                ('quarry-query','https://mygems.jmg.gov.my/server/rest/services/LombongKuari/Lombong_Kuari_Awam/FeatureServer/0/query',{'where':'1=1','outFields':'OBJECTID','returnGeometry':'true','outSR':'3857','resultRecordCount':'500','f':'json','geometry':bbox_s,'geometryType':'esriGeometryEnvelope','inSR':'3857','spatialRel':'esriSpatialRelIntersects','resultType':'tile','returnExceededLimitFeatures':'true'}),
              ]
              for name,url,p in queries:
                  try:
                      r=c.get(url,params=p)
                      print(f'QUERY {name}: HTTP={r.status_code} CT={r.headers.get("content-type","")} bytes={len(r.content)} URL={r.url}')
                      print('BODY',r.text[:1600].replace('\\n',' ').replace('\\r',' '))
                  except Exception as e: print('QUERY',name,'ERROR',type(e).__name__,e)

          PY
      - name: Remove probe workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_jmg_forensic_probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time JMG forensic probe"
          git push origin HEAD:feature/canonical-workspace-v2
