name: URBION Responsive Visual QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-visual:
    name: responsive-visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Playwright
        run: python -m pip install playwright
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Launch Render-equivalent Uvicorn command
        env:
          PYTHONPATH: .
          PORT: 8765
        run: |
          set -euo pipefail
          python -m uvicorn landing_server:app --host 0.0.0.0 --port "$PORT" > /tmp/urbion-responsive-uvicorn.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/urbion-responsive-uvicorn.log || true
            exit 1
          fi
          export URBION_BROWSER_ARTIFACT_DIR="/tmp/urbion-browser-qa"
          python tests/browser_responsive_visual_qa.py
      - name: Upload responsive visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urbion-responsive-visual
          path: /tmp/urbion-browser-qa/
          if-no-files-found: warn
