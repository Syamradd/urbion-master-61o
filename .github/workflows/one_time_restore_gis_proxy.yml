name: URBION One-Time Restore GIS Proxy
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
          fetch-depth: 20
      - name: Restore proxy from known-good parent and apply safe guards
        shell: bash
        run: |
          set -euo pipefail
          git checkout 67cbd479c0d9d6adcf75ad0a3b71f43ea4186318 -- urbion_wms_proxy.py
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('urbion_wms_proxy.py')
          s = p.read_text()

          # Guard the optional WMTS response before dereferencing status_code.
          s, n = re.subn(
              r'(?m)^            try: upstream = await _wmts_get\(query\)\n            except \(httpx\.HTTPError, asyncio\.TimeoutError\): continue\n            if upstream\.status_code != 200: continue$',
              '            try:\n                upstream = await _wmts_get(query)\n            except (httpx.HTTPError, asyncio.TimeoutError):\n                continue\n            if upstream is None or upstream.status_code != 200:\n                continue',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('WMTS guard target not found')

          # Keep JMG FeatureServer geometry as a deterministic fallback, but do not
          # make it the primary path when the authoritative MapServer export works.
          pattern = re.compile(
              r'(?ms)^    # Prefer the authoritative JMG FeatureServer geometry query.*?^    export_url = f"https://\{match\[0\]\}\{parsed_path\}/export"; last_detail = "no response"$'
          )
          replacement = '    export_url = f"https://{match[0]}{parsed_path}/export"; last_detail = "no response"'
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('JMG primary-path block not found')

          # Reinsert the FeatureServer fallback after MapServer export has had a chance.
          marker = '        body = upstream.text[:240].replace("\\n", " ").replace("\\r", " "); last_detail = f"HTTP={upstream.status_code} CT={content_type or \'-\'} BODY={body}"\n    return _proxy_failure("Authoritative ArcGIS upstream render failed", last_detail)'
          replacement = '        body = upstream.text[:240].replace("\\n", " ").replace("\\r", " "); last_detail = f"HTTP={upstream.status_code} CT={content_type or \'-\'} BODY={body}"\n    if is_jmg and parsed_path in JMG_FEATURE_FALLBACKS:\n        fallback = await _jmg_feature_image_fallback(parsed_path, params)\n        if fallback is not None:\n            return fallback\n    return _proxy_failure("Authoritative ArcGIS upstream render failed", last_detail)'
          if marker not in s:
              raise SystemExit('JMG fallback insertion marker not found')
          s = s.replace(marker, replacement, 1)

          p.write_text(s)
          PY
          python -m py_compile urbion_wms_proxy.py
          git diff --check
          grep -n "PLACEHOLDER" urbion_wms_proxy.py && exit 1 || true
      - name: Remove temporary workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_restore_gis_proxy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urbion_wms_proxy.py
          git commit -m "fix(gis): restore canonical proxy after regression"
          git push origin HEAD:feature/canonical-workspace-v2
