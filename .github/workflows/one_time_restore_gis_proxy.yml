name: URBION One-Time Restore GIS Proxy
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
          fetch-depth: 10
      - name: Restore proxy from known-good parent and apply safe guards
        shell: bash
        run: |
          set -euo pipefail
          git checkout 67cbd479c0d9d6adcf75ad0a3b71f43ea4186318 -- urbion_wms_proxy.py
          python - <<'PY'
          from pathlib import Path
          p = Path('urbion_wms_proxy.py')
          s = p.read_text()
          old = '''            try: upstream = await _wmts_get(query)\n            except (httpx.HTTPError, asyncio.TimeoutError): continue\n            if upstream.status_code != 200: continue'''
          new = '''            try:\n                upstream = await _wmts_get(query)\n            except (httpx.HTTPError, asyncio.TimeoutError):\n                continue\n            if upstream is None or upstream.status_code != 200:\n                continue'''
          if old not in s:
              raise SystemExit('WMTS guard target not found')
          s = s.replace(old, new, 1)
          old_jmg = '''    if is_jmg and parsed_path in JMG_FEATURE_FALLBACKS:\n        fallback = await _jmg_feature_image_fallback(parsed_path, params)\n        if fallback is not None: return fallback\n    export_url = f"https://{match[0]}{parsed_path}/export"; last_detail = "no response"'''
          new_jmg = '''    export_url = f"https://{match[0]}{parsed_path}/export"; last_detail = "no response"'''
          if old_jmg not in s:
              raise SystemExit('JMG ordering target not found')
          s = s.replace(old_jmg, new_jmg, 1)
          old_after = '''    if upstream is not None:\n        content_type = upstream.headers.get("content-type", "")\n        if upstream.status_code == 200 and content_type.lower().startswith("image/"):\n            return Response(upstream.content, status_code=200, media_type=content_type.split(";", 1)[0].strip() or "image/png", headers=_cache_headers())\n        body = upstream.text[:240].replace("\\n", " ").replace("\\r", " "); last_detail = f"HTTP={upstream.status_code} CT={content_type or '-'} BODY={body}"\n    return _proxy_failure("Authoritative ArcGIS upstream render failed", last_detail)'''
          new_after = '''    if upstream is not None:\n        content_type = upstream.headers.get("content-type", "")\n        if upstream.status_code == 200 and content_type.lower().startswith("image/"):\n            return Response(upstream.content, status_code=200, media_type=content_type.split(";", 1)[0].strip() or "image/png", headers=_cache_headers())\n        body = upstream.text[:240].replace("\\n", " ").replace("\\r", " "); last_detail = f"HTTP={upstream.status_code} CT={content_type or '-'} BODY={body}"\n    if is_jmg and parsed_path in JMG_FEATURE_FALLBACKS:\n        fallback = await _jmg_feature_image_fallback(parsed_path, params)\n        if fallback is not None:\n            return fallback\n    return _proxy_failure("Authoritative ArcGIS upstream render failed", last_detail)'''
          if old_after not in s:
              raise SystemExit('JMG fallback insertion target not found')
          s = s.replace(old_after, new_after, 1)
          p.write_text(s)
          PY
          python -m py_compile urbion_wms_proxy.py
          git diff --check
      - name: Remove temporary workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_restore_gis_proxy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urbion_wms_proxy.py
          git commit -m "fix(gis): restore canonical proxy after regression"
          git push origin HEAD:feature/canonical-workspace-v2
