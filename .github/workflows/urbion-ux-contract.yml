name: URBION UX Contract

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/ux-v5-command-center
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urbion-ux-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux-contract:
    name: ux-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate UX contract files
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_championship_ux_v4_contract.py
          tests/test_championship_ux_v5_contract.py
          tests/test_championship_entrypoint.py

      - name: Report
        if: always()
        run: |
          echo "URBION UX contract validation completed."
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
