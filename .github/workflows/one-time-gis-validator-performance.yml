name: one-time GIS validator performance repair

on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch GIS preflight execution
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/gis_upstream_preflight.py')
          text = path.read_text()

          if 'def wmts_rest_urls(' not in text:
              marker = '\n\ndef main() -> None:\n'
              insert = '''\n\ndef wmts_rest_urls(layer: str, zoom: int, x: int, y: int):\n    encoded_layer = quote(layer, safe=":")\n    for base in (\n        "https://iplan.planmalaysia.gov.my/geoserver/gwc/service/wmts/rest",\n        "https://iplan.planmalaysia.gov.my/geoserver/service/wmts/rest",\n    ):\n        for style in ("default", ""):\n            for matrix in (f"EPSG:900913:{zoom}", str(zoom)):\n                for row, col in ((y, x), (x, y)):\n                    yield f"{base}/{encoded_layer}/{style or 'default'}/EPSG:900913/{matrix}/{row}/{col}?format=image/png"\n'''
              if marker not in text:
                  raise SystemExit('main marker not found')
              text = text.replace(marker, insert + marker, 1)

          text = text.replace('max_workers = min(6, len(LAYERS))', 'max_workers = min(14, len(LAYERS))', 1)

          target = '''                if layer in TMS_FALLBACK_LAYERS:\n                    wmts_ok = False\n                    for wmts_url in WMTS_UPSTREAMS:\n'''
          replacement = '''                if layer in TMS_FALLBACK_LAYERS:\n                    wmts_rest_ok = False\n                    for wmts_rest_url in wmts_rest_urls(layer, 13, tile_x, tile_y):\n                        r_status, r_ct, r_size, r_elapsed, r_detail = probe(client, wmts_rest_url, {})\n                        r_ok = r_status == 200 and r_ct.lower().startswith("image/") and r_size > 100\n                        print(f"GWC WMTS REST FALLBACK {'PASS' if r_ok else 'FAIL'} · {layer} · HTTP={r_status} · CT={r_ct or '-'} · bytes={r_size} · {r_elapsed:.2f}s · {r_detail}")\n                        if r_ok:\n                            wmts_rest_ok = True\n                            break\n                    if wmts_rest_ok:\n                        continue\n                if layer in TMS_FALLBACK_LAYERS:\n                    wmts_ok = False\n                    for wmts_url in WMTS_UPSTREAMS:\n'''
          if target not in text:
              raise SystemExit('WMTS insertion anchor not found')
          text = text.replace(target, replacement, 1)

          path.write_text(text)
          compile(text, str(path), 'exec')
          print('GIS PREFLIGHT PERFORMANCE REPAIR APPLIED')
          PY

      - name: Verify invariants
        run: |
          python -m py_compile scripts/gis_upstream_preflight.py
          grep -q 'def wmts_rest_urls' scripts/gis_upstream_preflight.py
          grep -q 'max_workers = min(14' scripts/gis_upstream_preflight.py

      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/gis_upstream_preflight.py .github/workflows/one-time-gis-validator-performance.yml
          git rm .github/workflows/one-time-gis-validator-performance.yml
          git commit -m 'fix(ci): align GIS preflight with canonical fallback path'
          git push
