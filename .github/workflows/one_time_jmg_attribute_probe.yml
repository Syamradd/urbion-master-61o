name: URBION One-Time JMG Attribute Probe
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install httpx
        run: python -m pip install 'httpx<1.0,>=0.27'
      - name: Probe Major Fault attribute path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import httpx, time
          url='https://mygems.jmg.gov.my/server/rest/services/GeologiAsas/Major_Fault/FeatureServer/5/query'
          H={'User-Agent':'URBION-JMG-ATTR/1.0','Referer':'https://mygems.jmg.gov.my/','Accept':'application/json,*/*;q=0.8','Connection':'close'}
          where="Line_code IN (100,120,200,300,400)"
          with httpx.Client(timeout=httpx.Timeout(25.0,connect=8.0),follow_redirects=True,headers=H) as c:
              for name,p in [
                ('attr-count',{'where':where,'returnCountOnly':'true','f':'json'}),
                ('attr-ids',{'where':where,'returnIdsOnly':'true','f':'json'}),
                ('attr-geom',{'where':where,'outFields':'OBJECTID,Line_code','returnGeometry':'true','outSR':'3857','resultRecordCount':'2000','maxAllowableOffset':'4892','f':'json'}),
              ]:
                  t=time.perf_counter()
                  try:
                      r=c.get(url,params=p)
                      print(f'{name}: HTTP={r.status_code} CT={r.headers.get("content-type","")} bytes={len(r.content)} elapsed={time.perf_counter()-t:.2f}s')
                      print(r.text[:5000].replace('\\n',' ').replace('\\r',' '))
                  except Exception as e:
                      print(f'{name}: ERROR={type(e).__name__} elapsed={time.perf_counter()-t:.2f}s detail={e}')
          PY
      - name: Remove attribute probe
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_jmg_attribute_probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time JMG attribute probe"
          git push origin HEAD:feature/canonical-workspace-v2
