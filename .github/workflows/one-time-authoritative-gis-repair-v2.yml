name: one-time authoritative GIS repair v2

on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical authoritative GIS repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('urbion_wms_proxy.py')
          text = path.read_text()

          if 'async def _wmts_rest_fallback(' not in text:
              marker = '\n\nasync def _wmts_kvp_fallback(layer: str, params: dict[str, str]) -> Response | None:\n'
              insert = '''\n\nasync def _wmts_rest_fallback(layer: str, params: dict[str, str]) -> Response | None:\n    """Use GeoWebCache's documented RESTful WMTS resource for authoritative cached tiles."""\n    if layer not in WMTS_FALLBACK_LAYERS:\n        return None\n    xyz = _wmts_xyz(params)\n    if xyz is None:\n        return None\n    z, x, y = xyz\n    encoded_layer = quote(layer, safe=":")\n    candidates = []\n    for base in (\n        "https://iplan.planmalaysia.gov.my/geoserver/gwc/service/wmts/rest",\n        "https://iplan.planmalaysia.gov.my/geoserver/service/wmts/rest",\n    ):\n        for style in ("default", ""):\n            for matrix in (f"EPSG:900913:{z}", str(z)):\n                for row, col in ((y, x), (x, y)):\n                    candidates.append(\n                        f"{base}/{encoded_layer}/{style or 'default'}/EPSG:900913/{matrix}/{row}/{col}?format=image/png"\n                    )\n\n    async def probe(url: str):\n        try:\n            upstream = await _client_get(url, {})\n        except (httpx.HTTPError, asyncio.TimeoutError):\n            return None\n        content_type = upstream.headers.get("content-type", "")\n        if upstream.status_code == 200 and content_type.lower().startswith("image/") and len(upstream.content) > 100:\n            return upstream\n        return None\n\n    results = await asyncio.gather(*(probe(url) for url in candidates))\n    for upstream in results:\n        if upstream is not None:\n            return Response(\n                upstream.content, status_code=200,\n                media_type=upstream.headers.get("content-type", "image/png").split(";", 1)[0].strip() or "image/png",\n                headers={**_cache_headers(), "X-URBION-GIS-Fallback": "PLANMalaysia-GWC-WMTS-REST"},\n            )\n    return None\n'''
              if marker not in text:
                  raise SystemExit('WMTS KVP marker not found')
              text = text.replace(marker, insert + marker, 1)

          old = '    fallback = await _tms_tile_fallback(layers, params)\n'
          new = '    fallback = await _wmts_rest_fallback(layers, params)\n    if fallback is not None: return fallback\n    fallback = await _tms_tile_fallback(layers, params)\n'
          if old not in text:
              raise SystemExit('WMS TMS marker not found')
          text = text.replace(old, new, 1)

          text, count = re.subn(
              r'JMG_FEATURE_FALLBACKS = \{.*?\n\}',
              '''JMG_FEATURE_FALLBACKS = {\n    "/server/rest/services/GeologiAsas/Major_Fault/MapServer": ("/server/rest/services/GeologiAsas/Major_Fault/FeatureServer", 5),\n    "/server/rest/services/LombongKuari/Lombong_Kuari_Awam/MapServer": ("/server/rest/services/LombongKuari/Lombong_Kuari_Awam/FeatureServer", 0),\n    "/server/rest/services/Air_Bawah_Tanah/Air_Bawah_Tanah_Awam/MapServer": ("/server/rest/services/Air_Bawah_Tanah/Air_Bawah_Tanah_Awam/FeatureServer", 0),\n    "/server/rest/services/Demarcation/Litology_by_Negeri/MapServer": ("/server/rest/services/Demarcation/Litology_by_Negeri/FeatureServer", 22),\n}''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('JMG fallback mapping not found')

          anchor = '    export_url = f"https://{match[0]}{parsed_path}/export"; last_detail = "no response"\n'
          replacement = '''    last_detail = "no response"\n    if is_jmg and parsed_path in JMG_FEATURE_FALLBACKS:\n        fallback = await _jmg_feature_image_fallback(parsed_path, params)\n        if fallback is not None:\n            return fallback\n    export_url = f"https://{match[0]}{parsed_path}/export"\n'''
          if anchor not in text:
              raise SystemExit('ArcGIS export anchor not found')
          text = text.replace(anchor, replacement, 1)

          tail = '''    if is_jmg and parsed_path in JMG_FEATURE_FALLBACKS:\n        fallback = await _jmg_feature_image_fallback(parsed_path, params)\n        if fallback is not None:\n            return fallback\n    return _proxy_failure("Authoritative ArcGIS upstream render failed", last_detail)\n'''
          if tail not in text:
              raise SystemExit('ArcGIS fallback tail not found')
          text = text.replace(tail, '    return _proxy_failure("Authoritative ArcGIS upstream render failed", last_detail)\n', 1)

          path.write_text(text)
          compile(text, str(path), 'exec')
          assert 'async def _wmts_rest_fallback(' in text
          assert 'Air_Bawah_Tanah_Awam/FeatureServer' in text
          assert 'Demarcation/Litology_by_Negeri/FeatureServer' in text
          print('SURGICAL GIS REPAIR APPLIED')
          PY

      - name: Verify patch invariants
        run: |
          python -m py_compile urbion_wms_proxy.py
          grep -q 'async def _wmts_rest_fallback' urbion_wms_proxy.py
          grep -q 'Air_Bawah_Tanah_Awam/FeatureServer' urbion_wms_proxy.py
          grep -q 'Demarcation/Litology_by_Negeri/FeatureServer' urbion_wms_proxy.py

      - name: Commit repaired proxy and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urbion_wms_proxy.py .github/workflows/one-time-authoritative-gis-repair-v2.yml
          git rm .github/workflows/one-time-authoritative-gis-repair-v2.yml
          git commit -m 'fix(gis): add authoritative WMTS and JMG feature fallbacks'
          git push
