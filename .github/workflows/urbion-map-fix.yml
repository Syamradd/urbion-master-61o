name: URBION Map Fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production route and stale assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('championship_server.py')
          text = p.read_text(encoding='utf-8')
          needle = 'for _asset in sorted(ALLOWED_ASSETS):\n'
          insert = '''def _map_identify_runtime_asset():\n    target = BASE_DIR / "urbion_map_identify_runtime.js"\n    if not target.is_file():\n        raise HTTPException(status_code=404, detail="Map identify runtime not found")\n    return Response(target.read_text(encoding="utf-8"), media_type="application/javascript; charset=utf-8", headers={"Cache-Control": "no-store, max-age=0"})\n\n\napp.add_api_route("/urbion_map_identify_runtime.js", _map_identify_runtime_asset, methods=["GET"], include_in_schema=False)\n'''
          if 'def _map_identify_runtime_asset()' not in text:
              if needle not in text:
                  raise SystemExit('route insertion point not found')
              text = text.replace(needle, insert + needle, 1)
              p.write_text(text, encoding='utf-8')

          p = Path('tests/test_map_identify_runtime_wiring.py')
          text = p.read_text(encoding='utf-8')
          old = '''def test_identify_runtime_contains_live_query_and_conservative_evidence_guards():\n    assert "'/identify?'" in RUNTIME\n    assert "query_status:'LIVE_QUERY'" in RUNTIME\n    assert "evidence_state:'SOURCE_CONTEXT'" in RUNTIME\n    assert 'decision_safe:false' in RUNTIME\n    assert 'rule_binding_required:true' in RUNTIME\n    assert 'statutory_approval_claim:false' in RUNTIME\n'''
          new = '''def test_identify_runtime_contains_live_query_and_conservative_evidence_guards():\n    assert "'/spatial/site-context?'" in RUNTIME\n    assert "credentials:'same-origin'" in RUNTIME\n    assert "query_status:'LIVE_QUERY'" in RUNTIME\n    assert "decision_safe:false" in RUNTIME\n    assert "rule_binding_required:true" in RUNTIME\n    assert "statutory_approval_claim:false" in RUNTIME\n    assert "'/identify?'" not in RUNTIME\n'''
          if old not in text:
              raise SystemExit('stale wiring test block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add championship_server.py tests/test_map_identify_runtime_wiring.py
          git commit -m "fix(map): serve identify runtime and align tests"
          git push origin main
