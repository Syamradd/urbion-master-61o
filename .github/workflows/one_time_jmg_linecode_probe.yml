name: URBION One-Time JMG LineCode Probe
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install httpx
        run: python -m pip install 'httpx<1.0,>=0.27'
      - name: Probe indexed Line_code queries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import httpx, time, asyncio
          url='https://mygems.jmg.gov.my/server/rest/services/GeologiAsas/Major_Fault/FeatureServer/5/query'
          H={'User-Agent':'URBION-JMG-LINECODE/1.0','Referer':'https://mygems.jmg.gov.my/','Accept':'application/json,*/*;q=0.8','Connection':'close'}
          common={'outFields':'OBJECTID,Line_code','returnGeometry':'true','outSR':'3857','resultRecordCount':'2000','f':'json'}
          codes=[100,120,200,300,400]
          async def one(code):
              async with httpx.AsyncClient(timeout=httpx.Timeout(20.0,connect=8.0),follow_redirects=True,headers=H) as c:
                  t=time.perf_counter()
                  try:
                      r=await c.get(url,params={**common,'where':f'Line_code={code}'})
                      print(f'code={code}: HTTP={r.status_code} CT={r.headers.get("content-type","")} bytes={len(r.content)} elapsed={time.perf_counter()-t:.2f}s')
                      print(r.text[:1200].replace('\\n',' ').replace('\\r',' '))
                  except Exception as e: print(f'code={code}: ERROR={type(e).__name__} elapsed={time.perf_counter()-t:.2f}s detail={e}')
          asyncio.run(asyncio.gather(*(one(c) for c in codes)))
          PY
      - name: Remove linecode probe
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_jmg_linecode_probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time JMG linecode probe"
          git push origin HEAD:feature/canonical-workspace-v2
