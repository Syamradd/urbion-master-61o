name: URBION One-Time GIS Fallback Optimization Repair
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'httpx<1.0,>=0.27'
      - name: Optimize authoritative fallback execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('urbion_wms_proxy.py')
          s = p.read_text()
          old_tms = '''async def _tms_tile_fallback(layer: str, params: dict[str, str]) -> Response | None:\n    """Use GWC's authoritative TMS tile endpoint for layers whose WMS path is broken."""\n    if layer not in TMS_FALLBACK_LAYERS:\n        return None\n    xyz = _wmts_xyz(params)\n    if xyz is None:\n        return None\n    z, x, y_xyz = xyz\n    y_tms = (2 ** z - 1) - y_xyz\n    encoded_layer = quote(layer, safe=":")\n    for base in TMS_UPSTREAMS:\n        for gridset in ("EPSG:900913", "EPSG:4326"):\n            for ext in ("png", "jpeg"):\n                url = f"{base}/{encoded_layer}@{gridset}@{ext}/{z}/{x}/{y_tms}.{ext}"\n                try:\n                    upstream = await _client_get(url, {})\n                except (httpx.HTTPError, asyncio.TimeoutError):\n                    continue\n                if upstream.status_code != 200:\n                    continue\n                content_type = upstream.headers.get("content-type", "")\n                if not content_type.lower().startswith("image/"):\n                    continue\n                return Response(upstream.content, status_code=200, media_type=content_type.split(";", 1)[0].strip() or f"image/{ext}", headers={**_cache_headers(), "X-URBION-GIS-Fallback": "PLANMalaysia-GWC-TMS"})\n    return None\n'''
          new_tms = '''async def _tms_tile_fallback(layer: str, params: dict[str, str]) -> Response | None:\n    """Use GWC's authoritative TMS tile endpoint for layers whose WMS path is broken."""\n    if layer not in TMS_FALLBACK_LAYERS:\n        return None\n    xyz = _wmts_xyz(params)\n    if xyz is None:\n        return None\n    z, x, y_xyz = xyz\n    y_tms = (2 ** z - 1) - y_xyz\n    encoded_layer = quote(layer, safe=":")\n    urls = [\n        f"{base}/{encoded_layer}@{gridset}@{ext}/{z}/{x}/{y_tms}.{ext}"\n        for base in TMS_UPSTREAMS\n        for gridset in ("EPSG:900913", "EPSG:4326")\n        for ext in ("png", "jpeg")\n    ]\n    async def probe(url: str):\n        try:\n            upstream = await _client_get(url, {})\n        except (httpx.HTTPError, asyncio.TimeoutError):\n            return None\n        content_type = upstream.headers.get("content-type", "")\n        if upstream.status_code == 200 and content_type.lower().startswith("image/") and len(upstream.content) > 100:\n            return upstream\n        return None\n    results = await asyncio.gather(*(probe(url) for url in urls))\n    for upstream in results:\n        if upstream is not None:\n            return Response(upstream.content, status_code=200, media_type=upstream.headers.get("content-type", "image/png").split(";", 1)[0].strip() or "image/png", headers={**_cache_headers(), "X-URBION-GIS-Fallback": "PLANMalaysia-GWC-TMS"})\n    return None\n'''
          if old_tms not in s:
              raise SystemExit('TMS function anchor not found')
          s = s.replace(old_tms, new_tms, 1)
          old_wm = '''async def _wmts_get(params: dict[str, str]) -> httpx.Response | None:\n    """Try each official WMTS route, accepting only actual image tiles."""\n    for url in WMTS_UPSTREAMS:\n        try:\n            upstream = await _client_get(url, params)\n        except (httpx.HTTPError, asyncio.TimeoutError):\n            continue\n        content_type = upstream.headers.get("content-type", "")\n        if upstream.status_code == 200 and content_type.lower().startswith("image/") and len(upstream.content) > 100:\n            return upstream\n    return None\n'''
          new_wm = '''async def _wmts_get(params: dict[str, str]) -> httpx.Response | None:\n    """Try official WMTS routes concurrently, accepting only actual image tiles."""\n    async def probe(url: str):\n        try:\n            upstream = await _client_get(url, params)\n        except (httpx.HTTPError, asyncio.TimeoutError):\n            return None\n        content_type = upstream.headers.get("content-type", "")\n        if upstream.status_code == 200 and content_type.lower().startswith("image/") and len(upstream.content) > 100:\n            return upstream\n        return None\n    results = await asyncio.gather(*(probe(url) for url in WMTS_UPSTREAMS))\n    for upstream in results:\n        if upstream is not None:\n            return upstream\n    return None\n'''
          if old_wm not in s:
              raise SystemExit('WMTS function anchor not found')
          s = s.replace(old_wm, new_wm, 1)
          old_k = '''    variants = (f"EPSG:900913:{z}", str(z))\n    for matrix in variants:\n        for style in ("", "default"):\n            query = {\n                "SERVICE": "WMTS", "REQUEST": "GetTile", "VERSION": "1.0.0", "LAYER": layer,\n                "STYLE": style, "FORMAT": "image/png", "TILEMATRIXSET": "EPSG:900913",\n                "TILEMATRIX": matrix, "TILEROW": str(y), "TILECOL": str(x),\n            }\n            try:\n                upstream = await _wmts_get(query)\n            except (httpx.HTTPError, asyncio.TimeoutError):\n                continue\n            if upstream is None or upstream.status_code != 200:\n                continue\n            content_type = upstream.headers.get("content-type", "")\n            if not content_type.lower().startswith("image/"): continue\n            return Response(upstream.content, status_code=200, media_type=content_type.split(";", 1)[0].strip() or "image/png", headers={**_cache_headers(), "X-URBION-GIS-Fallback": "PLANMalaysia-GWC-WMTS"})\n    return None\n'''
          new_k = '''    queries = [\n        {\n            "SERVICE": "WMTS", "REQUEST": "GetTile", "VERSION": "1.0.0", "LAYER": layer,\n            "STYLE": style, "FORMAT": "image/png", "TILEMATRIXSET": "EPSG:900913",\n            "TILEMATRIX": matrix, "TILEROW": str(y), "TILECOL": str(x),\n        }\n        for matrix in (f"EPSG:900913:{z}", str(z))\n        for style in ("", "default")\n    ]\n    results = await asyncio.gather(*(_wmts_get(query) for query in queries), return_exceptions=True)\n    for upstream in results:\n        if isinstance(upstream, httpx.Response):\n            return Response(upstream.content, status_code=200, media_type=upstream.headers.get("content-type", "image/png").split(";", 1)[0].strip() or "image/png", headers={**_cache_headers(), "X-URBION-GIS-Fallback": "PLANMalaysia-GWC-WMTS"})\n    return None\n'''
          if old_k not in s:
              raise SystemExit('WMTS KVP anchor not found')
          s = s.replace(old_k, new_k, 1)
          old_order = '''    # Major Fault is a pathological dynamic service: prefer four bounded\n    # official FeatureServer spatial queries, then fall back to MapServer export.\n    if is_jmg and parsed_path.endswith("/GeologiAsas/Major_Fault/MapServer"):\n        fallback = await _jmg_feature_image_fallback(parsed_path, params)\n        if fallback is not None:\n            return fallback\n\n    export_url = f"https://{match[0]}{parsed_path}/export"; last_detail = "no response"\n'''
          new_order = '''    # Major Fault is a pathological dynamic service: prefer the official\n    # MapServer export image first; use bounded FeatureServer queries only as fallback.\n    export_url = f"https://{match[0]}{parsed_path}/export"; last_detail = "no response"\n'''
          if old_order not in s:
              raise SystemExit('Major Fault ordering anchor not found')
          s = s.replace(old_order, new_order, 1)
          p.write_text(s)
          PY
          python -m py_compile urbion_wms_proxy.py
          git diff --check
          grep -n "Try official WMTS routes concurrently\|MapServer export image first\|asyncio.gather" urbion_wms_proxy.py
      - name: Commit optimization and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_gis_fallback_optimization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urbion_wms_proxy.py
          git commit -m "fix(gis): optimize authoritative fallback execution"
          git push origin HEAD:feature/canonical-workspace-v2
