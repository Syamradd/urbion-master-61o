name: repair-horizon-language-dom
on:
  push:
    branches: [fix/horizon-visual-rebase]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horizon-visual-rebase
          fetch-depth: 1
      - name: Patch language DOM preservation and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('urbion_horizon_language_contract.js')
          s = p.read_text(encoding='utf-8')
          old = """document.querySelectorAll('button,label,h1,h2,h3,h4,p,small,span,a,.eyebrow,.label,.site-meta,.muted').forEach(el=>{\n    if(el.closest('script,style,textarea,input,select,option'))return;\n    const key=ensureKey(el);if(key)el.textContent=ms?EN_TO_BM[key]:key;\n  });"""
          new = """document.querySelectorAll('button,label,h1,h2,h3,h4,p,small,span,a,b,strong,em,.eyebrow,.label,.site-meta,.muted').forEach(el=>{\n    if(el.closest('script,style,textarea,input,select,option'))return;\n    if(el.children.length>0)return;\n    const key=ensureKey(el);if(key)el.textContent=ms?EN_TO_BM[key]:key;\n  });"""
          if old not in s:
              raise SystemExit('expected language apply block not found; refusing unsafe edit')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          targets = [
              '.github/workflows/_diag_case_dom.yml',
              '.github/workflows/_diag_case_controls.yml',
              '.github/workflows/_diag_horizon_runtime.yml',
              '.github/workflows/_final_horizon_language_pointer_patch.yml',
              '.github/workflows/_fix_horizon_contracts.yml',
              '.github/workflows/_fix_horizon_pointer_stack.yml',
              '.github/workflows/_wire_horizon_browser_qa.yml',
              '.github/workflows/_repair_horizon_language_route_v2.yml',
              '.github/workflows/_repair_horizon_language_dom.yml',
          ]
          for name in targets:
              Path(name).unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urbion_horizon_language_contract.js .github/workflows
          git commit -m 'fix(ui): preserve case controls during language translation'
          git push origin HEAD:fix/horizon-visual-rebase
