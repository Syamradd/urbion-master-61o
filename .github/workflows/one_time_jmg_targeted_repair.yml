name: URBION One-Time JMG Targeted Repair
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
      - name: Patch JMG pathological tile paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('urbion_wms_proxy.py')
          s = p.read_text()

          timeout_old = '_JMG_TIMEOUT = httpx.Timeout(connect=4.0, read=15.0, write=4.0, pool=4.0)'
          timeout_new = '_JMG_TIMEOUT = httpx.Timeout(connect=6.0, read=20.0, write=6.0, pool=6.0)'
          if timeout_old not in s:
              raise SystemExit('JMG timeout target not found')
          s = s.replace(timeout_old, timeout_new, 1)

          fn = '''async def _jmg_feature_image_fallback(parsed_path: str, params: dict[str, str]) -> Response | None:\n    target = JMG_FEATURE_FALLBACKS.get(parsed_path)\n    if not target:\n        return None\n    feature_path, layer_id = target\n    bbox_raw = str(params.get("bbox", ""))\n    try:\n        bbox = tuple(float(x) for x in bbox_raw.split(","))\n        if len(bbox) != 4:\n            return None\n    except (TypeError, ValueError):\n        return None\n    xmin, ymin, xmax, ymax = bbox\n    width = max(int(params.get("width", "256")), 1)\n    pixel_offset = max((xmax - xmin) / width, 1.0)\n    base_query = {\n        "where": "1=1", "outFields": "OBJECTID",\n        "returnGeometry": "true", "outSR": "3857",\n        "resultRecordCount": "500", "f": "json",\n    }\n\n    async def run_query(query_bbox: tuple[float, float, float, float]) -> dict | None:\n        qxmin, qymin, qxmax, qymax = query_bbox\n        query = {\n            **base_query,\n            "geometry": f"{qxmin},{qymin},{qxmax},{qymax}",\n            "geometryType": "esriGeometryEnvelope",\n            "inSR": "3857",\n            "spatialRel": "esriSpatialRelIntersects",\n            "resultType": "tile",\n            "returnExceededLimitFeatures": "true",\n            "maxAllowableOffset": f"{pixel_offset:.3f}",\n        }\n        query_url = f"https://mygems.jmg.gov.my{feature_path}/{layer_id}/query"\n        try:\n            upstream = await _client_get(query_url, query)\n        except (httpx.HTTPError, asyncio.TimeoutError):\n            return None\n        if upstream.status_code != 200:\n            return None\n        content_type = upstream.headers.get("content-type", "")\n        if "json" not in content_type.lower():\n            return None\n        try:\n            payload = upstream.json()\n        except ValueError:\n            return None\n        if isinstance(payload, dict) and payload.get("error"):\n            return None\n        return payload if isinstance(payload, dict) else None\n\n    if parsed_path.endswith("/GeologiAsas/Major_Fault/MapServer"):\n        xmid = (xmin + xmax) / 2.0\n        ymid = (ymin + ymax) / 2.0\n        boxes = (\n            (xmin, ymin, xmid, ymid), (xmid, ymin, xmax, ymid),\n            (xmin, ymid, xmid, ymax), (xmid, ymid, xmax, ymax),\n        )\n        results = await asyncio.gather(*(run_query(box) for box in boxes), return_exceptions=True)\n        features = []\n        for result in results:\n            if isinstance(result, dict):\n                features.extend(result.get("features") or [])\n        svg = _svg_from_arcgis_features({"features": features}, bbox, width, int(params.get("height", "256")))\n        if svg:\n            return Response(\n                svg.encode("utf-8"), status_code=200, media_type="image/svg+xml",\n                headers={**_cache_headers(), "X-URBION-GIS-Fallback": "JMG-FeatureServer-Split"},\n            )\n        return None\n\n    payload = await run_query(bbox)\n    if payload is None:\n        return None\n    svg = _svg_from_arcgis_features(payload, bbox, width, int(params.get("height", "256")))\n    if not svg:\n        svg = '<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"></svg>'\n    return Response(\n        svg.encode("utf-8"), status_code=200, media_type="image/svg+xml",\n        headers={**_cache_headers(), "X-URBION-GIS-Fallback": "JMG-FeatureServer"},\n    )\n'''
          m = re.search(r'(?ms)^async def _jmg_feature_image_fallback\(.*?(?=^@router\.get\("/map/wms")', s)
          if not m:
              raise SystemExit('JMG fallback function boundary not found')
          s = s[:m.start()] + fn + '\n\n' + s[m.end():]

          marker = '''    export_url = f"https://{match[0]}{parsed_path}/export"; last_detail = "no response"\n'''
          replacement = '''    # Major Fault is a pathological dynamic service: prefer four bounded\n    # official FeatureServer spatial queries, then fall back to MapServer export.\n    if is_jmg and parsed_path.endswith("/GeologiAsas/Major_Fault/MapServer"):\n        fallback = await _jmg_feature_image_fallback(parsed_path, params)\n        if fallback is not None:\n            return fallback\n\n    export_url = f"https://{match[0]}{parsed_path}/export"; last_detail = "no response"\n    export_params = dict(params)\n    if is_jmg:\n        export_params["format"] = "png8"\n'''
          if marker not in s:
              raise SystemExit('JMG export marker not found')
          s = s.replace(marker, replacement, 1)

          old_call = '        upstream = await _client_get(export_url, dict(params))'
          new_call = '        upstream = await _client_get(export_url, export_params)'
          if old_call not in s:
              raise SystemExit('ArcGIS export call target not found')
          s = s.replace(old_call, new_call, 1)

          p.write_text(s)
          for path in (Path('urbion_wms_proxy.py'),):
              text = path.read_text()
              if 'PLACEHOLDER' in text:
                  raise SystemExit(f'PLACEHOLDER remains in {path}')
          PY
          python -m py_compile urbion_wms_proxy.py
          git diff --check
          grep -n "_JMG_TIMEOUT\|Major Fault is a pathological\|JMG-FeatureServer-Split" urbion_wms_proxy.py
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_jmg_targeted_repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urbion_wms_proxy.py
          git commit -m "fix(gis): bound pathological JMG fault rendering"
          git push origin HEAD:feature/canonical-workspace-v2
