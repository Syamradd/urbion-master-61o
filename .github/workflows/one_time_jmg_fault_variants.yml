name: URBION One-Time JMG Fault Variants
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install httpx
        run: python -m pip install 'httpx<1.0,>=0.27'
      - name: Probe fault render/query variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import httpx, time
          bbox='11349369.95978297,195678.7924100496,11388505.718264982,234814.55089206249'
          H={'User-Agent':'URBION-JMG-FAULT-VARIANTS/1.0','Referer':'https://mygems.jmg.gov.my/','Accept':'image/png,image/*,application/json,*/*;q=0.8','Connection':'close'}
          base={'bbox':bbox,'bboxSR':'3857','imageSR':'3857','size':'256,256','dpi':'96','transparent':'true'}
          variants=[
            ('map-png8','https://mygems.jmg.gov.my/server/rest/services/GeologiAsas/Major_Fault/MapServer/export',{**base,'format':'png8','f':'image','layers':'show:5'}),
            ('map-png','https://mygems.jmg.gov.my/server/rest/services/GeologiAsas/Major_Fault/MapServer/export',{**base,'format':'png','f':'image','layers':'show:5'}),
            ('map-no-dpi','https://mygems.jmg.gov.my/server/rest/services/GeologiAsas/Major_Fault/MapServer/export',{**base,'format':'png32','f':'image','layers':'show:5'}),
            ('map-query-offset','https://mygems.jmg.gov.my/server/rest/services/GeologiAsas/Major_Fault/MapServer/5/query',{'where':'1=1','outFields':'OBJECTID','returnGeometry':'true','outSR':'3857','resultRecordCount':'500','f':'json','geometry':bbox,'geometryType':'esriGeometryEnvelope','inSR':'3857','spatialRel':'esriSpatialRelIntersects','resultType':'tile','returnExceededLimitFeatures':'true','maxAllowableOffset':'4892'}),
            ('feature-query-offset','https://mygems.jmg.gov.my/server/rest/services/GeologiAsas/Major_Fault/FeatureServer/5/query',{'where':'1=1','outFields':'OBJECTID','returnGeometry':'true','outSR':'3857','resultRecordCount':'500','f':'json','geometry':bbox,'geometryType':'esriGeometryEnvelope','inSR':'3857','spatialRel':'esriSpatialRelIntersects','resultType':'tile','returnExceededLimitFeatures':'true','maxAllowableOffset':'4892'}),
            ('feature-query-offset2','https://mygems.jmg.gov.my/server/rest/services/GeologiAsas/Major_Fault/FeatureServer/5/query',{'where':'1=1','outFields':'OBJECTID','returnGeometry':'true','outSR':'3857','resultRecordCount':'500','f':'json','geometry':bbox,'geometryType':'esriGeometryEnvelope','inSR':'3857','spatialRel':'esriSpatialRelIntersects','maxAllowableOffset':'9784'}),
          ]
          with httpx.Client(timeout=httpx.Timeout(35.0,connect=8.0),follow_redirects=True,headers=H) as c:
              for name,url,params in variants:
                  t=time.perf_counter()
                  try:
                      r=c.get(url,params=params)
                      print(f'{name}: HTTP={r.status_code} CT={r.headers.get("content-type","")} bytes={len(r.content)} elapsed={time.perf_counter()-t:.2f}s URL={r.url}')
                      if not r.headers.get('content-type','').lower().startswith('image/'):
                          print('BODY',r.text[:1200].replace('\\n',' ').replace('\\r',' '))
                  except Exception as e:
                      print(f'{name}: ERROR={type(e).__name__} elapsed={time.perf_counter()-t:.2f}s detail={e}')
          PY
      - name: Remove variant probe
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_jmg_fault_variants.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time JMG fault variants probe"
          git push origin HEAD:feature/canonical-workspace-v2
