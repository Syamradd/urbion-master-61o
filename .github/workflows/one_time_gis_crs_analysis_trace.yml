name: URBION One-Time GIS CRS and Analysis Trace
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Patch authoritative i-Plan CRS alias handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('urbion_wms_proxy.py')
          s = p.read_text()
          needle = '    params = {key.lower(): value for key, value in request.query_params.multi_items() if key.lower() in ALLOWED_WMS_PARAMS}\n'
          repl = needle + '    for _crs_key in ("srs", "crs"):\n        if str(params.get(_crs_key, "")).upper() == "EPSG:3857":\n            params[_crs_key] = "EPSG:900913"\n'
          if 'if str(params.get(_crs_key, "")).upper() == "EPSG:3857"' in s:
              raise SystemExit('CRS alias patch already present')
          if needle not in s:
              raise SystemExit('WMS params anchor not found')
          p.write_text(s.replace(needle, repl, 1))
          PY
          python -m py_compile urbion_wms_proxy.py
          git diff --check
      - name: Start canonical server
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m uvicorn landing_server:app --host 127.0.0.1 --port 8765 >/tmp/urbion-trace.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/health >/dev/null
      - name: Targeted GIS CRS alias smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import httpx
          base='http://127.0.0.1:8765/map/wms'
          bbox='11349369.959782971,234814.5508920622,11388505.71826498,273950.3093740722'
          failures=[]
          for layer in ('iplan:rsn','iplan:warisan','iplan:rumah_mampu_milik','iplan:topo'):
              try:
                  r=httpx.get(base,params={'service':'WMS','request':'GetMap','layers':layer,'styles':'','format':'image/png','transparent':'true','version':'1.1.1','tiled':'true','width':'256','height':'256','srs':'EPSG:3857','bbox':bbox},timeout=60)
                  print(layer, r.status_code, r.headers.get('content-type',''), len(r.content))
                  if not (r.status_code==200 and r.headers.get('content-type','').lower().startswith('image/') and len(r.content)>100): failures.append(layer)
              except Exception as e:
                  print(layer,'EXCEPTION',repr(e)); failures.append(layer)
          if failures: raise SystemExit('CRS alias smoke failures: '+', '.join(failures))
          print('TARGETED GIS CRS ALIAS SMOKE: PASS')
          PY
      - name: Trace canonical deep browser analysis
        shell: bash
        run: |
          set +e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          URBION_BASE_URL=http://127.0.0.1:8765 URBION_ARTIFACT_DIR=artifacts/one-time-analysis-trace python scripts/workspace_browser_smoke.py > /tmp/deep-trace.log 2>&1
          rc=$?
          echo "DEEP_TRACE_RC=$rc"
          tail -n 120 /tmp/deep-trace.log
          echo '===== SERVER ANALYSIS TRACE ====='
          tail -n 240 /tmp/urbion-trace.log || true
          exit 0
      - name: Commit verified GIS repair and remove diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_gis_crs_analysis_trace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urbion_wms_proxy.py
          git commit -m "fix(gis): normalize equivalent i-plan CRS alias"
          git push origin HEAD:feature/canonical-workspace-v2
