name: _parallel_release_repair

on:
  push:
    branches:
      - feature/canonical-workspace-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply coordinated repair
        run: python scripts/_parallel_release_repair.py

      - name: Validate edited Python modules
        run: python -m py_compile urbion_wms_proxy.py

      - name: Validate edited JavaScript syntax
        run: |
          node --check urbion_workspace_bridge.js
          node --check urbion_workspace_lifecycle_hardening.js

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_live_frontend_contract.py tests/test_release_gate_audit.py tests/test_final_e2e_audit.py

      - name: Remove repair automation and commit coordinated fix
        shell: bash
        run: |
          rm -f scripts/_parallel_release_repair.py .github/workflows/_parallel_release_repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urbion_wms_proxy.py urbion_workspace_bridge.js urbion_workspace_lifecycle_hardening.js scripts/_parallel_release_repair.py .github/workflows/_parallel_release_repair.yml
          git commit -m 'fix(release): converge GIS routing and analysis lifecycle' || exit 0
          git push origin HEAD:feature/canonical-workspace-v2
