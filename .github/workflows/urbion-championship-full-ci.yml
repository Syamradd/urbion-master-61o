name: URBION Championship Full CI (Legacy Archive)

# The historical championship workflow is retained for reproducibility only.
# The canonical release path is now enforced by urbion-ci.yml and the dedicated
# workspace/render-parity gates. Keep this workflow manual to avoid duplicate
# or stale release checks from historical frontend architecture.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-contract:
    name: legacy-archive-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify canonical release entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('render.yaml').read_text(encoding='utf-8')
          assert 'uvicorn landing_server:app --host 0.0.0.0 --port $PORT' in text
          print('LEGACY_ARCHIVE_ENTRYPOINT_CONTRACT_OK')
          PY
