name: URBION Championship Full CI

on:
  push:
    branches: [main, feature/champion-command-center-consolidation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: regression-${{ matrix.lane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [core, frontend, mapping, planning, judge, spatial, station, impact, policy, recommendation, lcp, redteam, smoke, release, presentation, contract, final]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run lane
        env:
          PYTHONPATH: .
        run: |
          case "${{ matrix.lane }}" in
            core) python -m pytest -q tests/test_spatial_input_guard.py tests/test_km_endpoint_contract.py tests/test_kebenaran_merancang.py tests/test_master_hardening_scoring.py ;;
            frontend) python -m pytest -q tests/test_live_frontend_contract.py tests/test_ui_controller_contract.py tests/test_decision_center_contract.py tests/test_master171_evidence_ui.py tests/test_master172_what_if_delta.py tests/test_what_if_frontend_contract.py tests/test_planner_review_contract.py tests/test_master174_planner_actions.py tests/test_master_decision_rendering.py tests/test_master_decision_center_workstation.py tests/test_master308_input_sync.py tests/test_master309_unified_assessment_state.py tests/test_master312_workflow.py tests/test_master313_workflow_engine.py tests/test_master314_intelligence_ui.py tests/test_master322_spatial_workstation.py tests/test_master323_spatial_implications.py tests/test_master324_decision_chain_consolidation.py tests/test_master325_330_final_acceptance.py tests/test_master331_336_night_release.py tests/test_master337_340_spatial_intelligence.py tests/test_master341_345_workstation.py tests/test_master346_350_championship_workstation_ui.py tests/test_master_d8_d9_system_audit.py tests/test_championship_ux_v4_contract.py tests/test_championship_ux_v5_contract.py tests/test_unified_workspace_bridge_contract.py tests/test_championship_runtime_integrity.py ;;
            mapping) python -m pytest -q tests/test_map_studio_contract.py tests/test_master170_controls.py tests/test_hydrology_source.py tests/test_master_map_layer_renderability.py ;;
            planning) python -m pytest -q tests/test_master173_km_planner_surface.py tests/test_km_endpoint_contract.py tests/test_master341_345_workstation.py ;;
            judge) python -m pytest -q tests/test_master175_release_gate.py tests/test_decision_center_contract.py tests/test_master171_evidence_ui.py tests/test_master172_what_if_delta.py tests/test_what_if_frontend_contract.py tests/test_master192_judge_run.py tests/test_master308_input_sync.py tests/test_master309_unified_assessment_state.py tests/test_master325_330_final_acceptance.py tests/test_master331_336_night_release.py tests/test_master337_340_spatial_intelligence.py tests/test_master341_345_workstation.py tests/test_master346_350_championship_workstation_ui.py tests/test_master_d8_d9_system_audit.py ;;
            spatial) python -m pytest -q tests/test_master183_spatial_sources.py tests/test_master183_multi_source_helpers.py tests/test_master183_decision_spatial_surface.py tests/test_master325_330_final_acceptance.py tests/test_master331_336_night_release.py tests/test_master337_340_spatial_intelligence.py tests/test_master341_345_workstation.py tests/test_master346_350_championship_workstation_ui.py tests/test_master_d8_d9_system_audit.py tests/test_master_spatial_context_live.py tests/test_master_spatial_context_engine_binding.py tests/test_master_lot_resolution.py ;;
            station) python -m pytest -q tests/test_master184_station_intelligence.py tests/test_master184_endpoint_contract.py ;;
            impact) python -m pytest -q tests/test_master185_development_impact.py ;;
            policy) python -m pytest -q tests/test_master186_policy_graph.py ;;
            recommendation) python -m pytest -q tests/test_master187_recommendations.py ;;
            lcp) python -m pytest -q tests/test_master188_lcp_intelligence.py tests/test_master188_lcp_endpoint.py tests/test_master189_integration_ui.py tests/test_master199_integrated_decision_orchestration.py tests/test_master341_345_workstation.py ;;
            redteam) python -m pytest -q tests/test_master190_red_team.py tests/test_master196_integrity_gate.py tests/test_master325_330_final_acceptance.py tests/test_master331_336_night_release.py tests/test_master337_340_spatial_intelligence.py tests/test_master341_345_workstation.py tests/test_master346_350_championship_workstation_ui.py tests/test_master_d8_d9_system_audit.py ;;
            smoke) python -m pytest -q tests/test_master191_deployment_smoke.py ;;
            release) python -m pytest -q tests/test_master193_release_lock.py tests/test_master194_release_candidate.py tests/test_master194_visual_function.py tests/test_master195_release_packet.py tests/test_master325_330_final_acceptance.py tests/test_master331_336_night_release.py tests/test_master337_340_spatial_intelligence.py tests/test_master341_345_workstation.py tests/test_master346_350_championship_workstation_ui.py tests/test_master_d8_d9_system_audit.py ;;
            presentation) python -m pytest -q tests/test_master197_presentation_ready.py ;;
            contract) python -m pytest -q tests/test_master202_championship_contract.py tests/test_evidence_ledger.py tests/test_validation_api_contract.py tests/test_championship_ux_v4_contract.py tests/test_championship_ux_v5_contract.py tests/test_championship_runtime_integrity.py ;;
            final) python -m pytest -q tests/test_master198_final_acceptance.py tests/test_master202_championship_contract.py tests/test_master325_330_final_acceptance.py tests/test_master331_336_night_release.py tests/test_master337_340_spatial_intelligence.py tests/test_master341_345_workstation.py tests/test_master346_350_championship_workstation_ui.py tests/test_master_d8_d9_system_audit.py tests/test_championship_runtime_integrity.py ;;
          esac

  runtime-smoke:
    name: runtime-smoke
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Launch Render-equivalent Uvicorn command
        env:
          PYTHONPATH: .
          PORT: 8765
        run: |
          set -euo pipefail
          python -m uvicorn championship_server:app --host 0.0.0.0 --port "$PORT" > /tmp/urbion-uvicorn.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json, time, urllib.request
          base = 'http://127.0.0.1:8765'
          for _ in range(30):
              try:
                  for path in ['/health', '/metadata', '/championship-gate', '/']:
                      with urllib.request.urlopen(base + path, timeout=3) as response:
                          body = response.read()
                          assert response.status == 200 and body
                          if path != '/': json.loads(body.decode('utf-8'))
                          if path == '/':
                              html = body.decode('utf-8')
                              assert 'URBION HORIZON — Championship Workstation' in html
                              assert 'window.__URBION_FRONTEND_BOOT__' in html
                              assert 'release:"MASTER-331"' in html
                              assert 'id="urbion-championship"' in html
                              assert 'Site + Development Inputs' not in html
                              assert 'Decision OS' not in html
                              assert 'Planner Workstation' not in html
                  for asset in ['/urbion_championship_final_command_center.js','/urbion_championship_final_command_center_hotfix.js','/urbion_championship_final_command_center_polish.js','/urbion_championship_final_command_center_policy.js','/urbion_championship_champion_review.js','/urbion_championship_final_runtime_enforcer.js','/urbion_championship_premium_v3.js','/urbion_championship_premium_v4.js']:
                      with urllib.request.urlopen(base + asset, timeout=3) as response:
                          assert response.status == 200 and response.read()
                  print('RUNTIME_SMOKE_OK')
                  raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          print(open('/tmp/urbion-uvicorn.log', encoding='utf-8').read())
          raise SystemExit(f'Runtime smoke failed: {last_error}')
          PY

  browser-qa:
    name: browser-qa
    needs: runtime-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Playwright
        run: python -m pip install playwright
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Launch Render-equivalent Uvicorn command
        env:
          PYTHONPATH: tests:.
          PORT: 8765
        run: |
          set -euo pipefail
          python -m uvicorn championship_server:app --host 0.0.0.0 --port "$PORT" > /tmp/urbion-browser-uvicorn.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then break; fi
            sleep 1
          done
          python tests/browser_championship_qa_stable.py
          python tests/browser_horizon_visual_language_qa.py
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urbion-browser-qa
          path: /tmp/urbion-browser-qa/
          if-no-files-found: warn

  full:
    name: full-regression
    runs-on: ubuntu-latest
    needs: browser-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full regression suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q
