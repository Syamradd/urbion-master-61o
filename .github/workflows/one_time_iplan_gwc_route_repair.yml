name: URBION One-Time i-Plan Route Repair
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
      - name: Patch official GeoWebCache root routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('urbion_wms_proxy.py')
          s = p.read_text()
          old_wms = '''ROOT_WMS_UPSTREAMS = (\n    "https://iplan.planmalaysia.gov.my/geoserver/wms",\n    "https://iplan.planmalaysia.gov.my/geoserver/ows",\n)'''
          new_wms = '''ROOT_WMS_UPSTREAMS = (\n    "https://iplan.planmalaysia.gov.my/geoserver/service/wms",\n    "https://iplan.planmalaysia.gov.my/geoserver/wms",\n    "https://iplan.planmalaysia.gov.my/geoserver/ows",\n)'''
          old_wmts = 'WMTS_UPSTREAM = "https://iplan.planmalaysia.gov.my/geoserver/gwc/service/wmts"'
          new_wmts = '''WMTS_UPSTREAMS = (\n    "https://iplan.planmalaysia.gov.my/geoserver/gwc/service/wmts",\n    "https://iplan.planmalaysia.gov.my/geoserver/service/wmts",\n)\nWMTS_UPSTREAM = WMTS_UPSTREAMS[0]'''
          if old_wms not in s:
              raise SystemExit('ROOT_WMS_UPSTREAMS target not found')
          if old_wmts not in s:
              raise SystemExit('WMTS_UPSTREAM target not found')
          s = s.replace(old_wms, new_wms, 1).replace(old_wmts, new_wmts, 1)
          s = s.replace('upstream = await _client_get(WMTS_UPSTREAM, query)', 'upstream = await _wmts_get(query)', 1)
          marker = '''async def _wmts_kvp_fallback(layer: str, params: dict[str, str]) -> Response | None:\n'''
          helper = '''async def _wmts_get(params: dict[str, str]) -> httpx.Response | None:\n    for url in WMTS_UPSTREAMS:\n        try:\n            upstream = await _client_get(url, params)\n        except (httpx.HTTPError, asyncio.TimeoutError):\n            continue\n        if upstream.status_code == 200:\n            return upstream\n    return None\n\n\n'''
          if marker not in s:
              raise SystemExit('WMTS fallback marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY
          python -m py_compile urbion_wms_proxy.py
          git diff --check
      - name: Remove temporary workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_iplan_gwc_route_repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urbion_wms_proxy.py
          git commit -m "fix(gis): route i-Plan GeoWebCache through official service endpoints"
          git push origin HEAD:feature/canonical-workspace-v2