name: _TMP P2-04 Diagnostic

on:
  push:
    branches: [fix/p2-04-futuristic-visual-identity]

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Playwright
        run: python -m pip install playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Diagnose assessment and browser flow
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn championship_server:app --host 0.0.0.0 --port 8765 > /tmp/urbion-diag-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; echo "--- SERVER LOG ---"; cat /tmp/urbion-diag-server.log' EXIT
          python - <<'PY'
          import json, time, urllib.request
          base='http://127.0.0.1:8765'
          for _ in range(30):
              try:
                  with urllib.request.urlopen(base+'/health', timeout=2) as r:
                      if r.status == 200: break
              except Exception: pass
              time.sleep(1)
          payload={
            'project_name':'Browser QA · Sg. Udang','site_lat':2.285,'site_lon':102.196,
            'tod_lat':None,'tod_lon':None,'state':'Melaka','pbt':'Majlis Bandaraya Melaka Bersejarah',
            'district':'Melaka Tengah','land_use':'Komersial','landuse':'Komersial',
            'development_class':'Pembangunan Penggunaan Bercampur','category':'Pembangunan Penggunaan Bercampur',
            'activity':'TOD / Mixed Use','development_type':'New Development','development':'New Development',
            'plot_ratio':4.5
          }
          for path in ['/assess','/spatial/site-context']:
              body=json.dumps(payload).encode() if path=='/assess' else json.dumps({'site_lat':2.285,'site_lon':102.196,'state':'Melaka'}).encode()
              req=urllib.request.Request(base+path,data=body,headers={'Content-Type':'application/json'},method='POST')
              t=time.monotonic()
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      data=r.read()
                      print(f'DIAG {path} status={r.status} elapsed={time.monotonic()-t:.2f}s bytes={len(data)}')
                      print(data[:1000].decode('utf-8','replace'))
              except Exception as e:
                  print(f'DIAG {path} FAILED elapsed={time.monotonic()-t:.2f}s error={e!r}')
          PY
          python -m playwright install chromium >/dev/null 2>&1 || true
          python - <<'PY'
          import asyncio, json, time
          from playwright.async_api import async_playwright
          BASE='http://127.0.0.1:8765'
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1440,'height':900})
                  events=[]
                  errors=[]
                  page.on('console', lambda m: errors.append('console:'+m.text) if m.type=='error' else None)
                  page.on('pageerror', lambda e: errors.append('pageerror:'+str(e)))
                  page.on('requestfailed', lambda r: events.append({'kind':'requestfailed','method':r.method,'url':r.url,'failure':r.failure}))
                  page.on('response', lambda r: events.append({'kind':'response','status':r.status,'url':r.url}) if any(x in r.url for x in ['/assess','/spatial/','/lcp','/iplan/','/decision','/copilot']) else None)
                  await page.goto(BASE+'/',wait_until='networkidle',timeout=30000)
                  vals={'#cs-project_name':'Browser QA · Sg. Udang','#cs-lat':'2.285','#cs-lon':'102.196','#cs-ratio':'4.5'}
                  for s,v in vals.items(): await page.locator(s).fill(v)
                  for s,label in [('#cs-state','Melaka'),('#cs-pbt','Majlis Bandaraya Melaka Bersejarah'),('#cs-district','Melaka Tengah'),('#cs-landuse','Komersial'),('#cs-category','Pembangunan Penggunaan Bercampur'),('#cs-activity','TOD / Mixed Use'),('#cs-development','New Development')]:
                      await page.locator(s).select_option(label=label)
                  await page.locator('#cs-run').click()
                  t=time.monotonic()
                  last=''
                  while time.monotonic()-t < 38:
                      last=await page.locator('#cs-status-pill').inner_text()
                      if last=='ANALYSIS READY': break
                      await page.wait_for_timeout(500)
                  print('BROWSER_STATUS',last,'elapsed',round(time.monotonic()-t,2))
                  print('BROWSER_QA',json.dumps(await page.evaluate('window.__URBION_QA__'),ensure_ascii=False))
                  print('BROWSER_ERRORS',json.dumps(errors,ensure_ascii=False))
                  print('BROWSER_EVENTS',json.dumps(events,ensure_ascii=False))
                  print('BROWSER_STATUS_TEXT',await page.locator('#cs-status-pill').inner_text())
                  await browser.close()
          asyncio.run(main())
          PY
