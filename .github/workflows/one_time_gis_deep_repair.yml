name: URBION One-Time GIS Deep Repair
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
          fetch-depth: 40
      - name: Apply evidence-backed GIS repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          proxy = Path('urbion_wms_proxy.py')
          s = proxy.read_text()

          old_wmts = '''async def _wmts_get(params: dict[str, str]) -> httpx.Response | None:\n    for url in WMTS_UPSTREAMS:\n        try:\n            upstream = await _client_get(url, params)\n        except (httpx.HTTPError, asyncio.TimeoutError):\n            continue\n        if upstream.status_code == 200:\n            return upstream\n    return None\n'''
          new_wmts = '''async def _wmts_get(params: dict[str, str]) -> httpx.Response | None:\n    \"\"\"Try each official WMTS route, accepting only actual image tiles.\"\"\"\n    for url in WMTS_UPSTREAMS:\n        try:\n            upstream = await _client_get(url, params)\n        except (httpx.HTTPError, asyncio.TimeoutError):\n            continue\n        content_type = upstream.headers.get(\"content-type\", \"\")\n        if upstream.status_code == 200 and content_type.lower().startswith(\"image/\") and len(upstream.content) > 100:\n            return upstream\n    return None\n'''
          if old_wmts not in s:
              raise SystemExit('WMTS helper target not found')
          s = s.replace(old_wmts, new_wmts, 1)

          jmg = '''async def _jmg_feature_image_fallback(parsed_path: str, params: dict[str, str]) -> Response | None:\n    target = JMG_FEATURE_FALLBACKS.get(parsed_path)\n    if not target:\n        return None\n    feature_path, layer_id = target\n    bbox_raw = str(params.get(\"bbox\", \"\"))\n    try:\n        bbox = tuple(float(x) for x in bbox_raw.split(\",\"))\n        if len(bbox) != 4:\n            return None\n    except (TypeError, ValueError):\n        return None\n\n    base_query = {\n        \"where\": \"1=1\", \"outFields\": \"OBJECTID,Line_code,Type,Name\",\n        \"returnGeometry\": \"true\", \"outSR\": \"3857\", \"resultRecordCount\": \"500\", \"f\": \"json\",\n    }\n    queries = [\n        (\n            f\"https://mygems.jmg.gov.my{feature_path}/{layer_id}/query\",\n            {\n                **base_query,\n                \"geometry\": bbox_raw,\n                \"geometryType\": \"esriGeometryEnvelope\",\n                \"inSR\": \"3857\",\n                \"spatialRel\": \"esriSpatialRelIntersects\",\n                \"resultType\": \"tile\",\n                \"returnExceededLimitFeatures\": \"true\",\n            },\n        ),\n        (\n            f\"https://mygems.jmg.gov.my{parsed_path}/{layer_id}/query\",\n            base_query,\n        ),\n    ]\n    for query_url, query in queries:\n        try:\n            upstream = await _client_get(query_url, query)\n        except (httpx.HTTPError, asyncio.TimeoutError):\n            continue\n        if upstream.status_code != 200:\n            continue\n        content_type = upstream.headers.get(\"content-type\", \"\")\n        if \"json\" not in content_type.lower():\n            continue\n        try:\n            payload = upstream.json()\n        except ValueError:\n            continue\n        if isinstance(payload, dict) and payload.get(\"error\"):\n            continue\n        svg = _svg_from_arcgis_features(payload, bbox)\n        if not svg:\n            svg = '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"256\" height=\"256\" viewBox=\"0 0 256 256\"></svg>'\n        return Response(\n            svg.encode(\"utf-8\"), status_code=200, media_type=\"image/svg+xml\",\n            headers={**_cache_headers(), \"X-URBION-GIS-Fallback\": \"JMG-FeatureServer\"},\n        )\n    return None\n'''
          m = re.search(r'(?ms)^async def _jmg_feature_image_fallback\(.*?(?=^@router\.get\("/map/wms")', s)
          if not m:
              raise SystemExit('JMG fallback function boundary not found')
          s = s[:m.start()] + jmg + '\n\n' + s[m.end():]

          proxy.write_text(s)

          pre = Path('scripts/gis_upstream_preflight.py')
          p = pre.read_text()
          p = p.replace('''WMTS_UPSTREAM = \"https://iplan.planmalaysia.gov.my/geoserver/gwc/service/wmts\"\nTMS_UPSTREAM = \"https://iplan.planmalaysia.gov.my/geoserver/gwc/service/tms/1.0.0\"\nDIRECT_WMS = \"https://iplan.planmalaysia.gov.my/geoserver/iplan/wms\"\n''', '''WMTS_UPSTREAMS = (\n    \"https://iplan.planmalaysia.gov.my/geoserver/gwc/service/wmts\",\n    \"https://iplan.planmalaysia.gov.my/geoserver/service/wmts\",\n)\nTMS_UPSTREAMS = (\n    \"https://iplan.planmalaysia.gov.my/geoserver/gwc/service/tms/1.0.0\",\n    \"https://iplan.planmalaysia.gov.my/geoserver/service/tms/1.0.0\",\n)\nROOT_WMS_UPSTREAMS = (\n    \"https://iplan.planmalaysia.gov.my/geoserver/service/wms\",\n    \"https://iplan.planmalaysia.gov.my/geoserver/wms\",\n    \"https://iplan.planmalaysia.gov.my/geoserver/ows\",\n)\nDIRECT_WMS = \"https://iplan.planmalaysia.gov.my/geoserver/iplan/wms\"\n''', 1)
          p = p.replace('''def tms_url(layer: str, zoom: int, x: int, y_xyz: int) -> str:\n    y_tms = (2**zoom - 1) - y_xyz\n    encoded_layer = quote(layer, safe=\":\")\n    return f\"{TMS_UPSTREAM}/{encoded_layer}@EPSG:900913@png/{zoom}/{x}/{y_tms}.png\"\n''', '''def tms_urls(layer: str, zoom: int, x: int, y_xyz: int):\n    y_tms = (2**zoom - 1) - y_xyz\n    encoded_layer = quote(layer, safe=\":\")\n    return tuple(f\"{base}/{encoded_layer}@EPSG:900913@png/{zoom}/{x}/{y_tms}.png\" for base in TMS_UPSTREAMS)\n''', 1)
          old_wmts_block = '''                    wmts_ok = False\n                    for matrix in (\"EPSG:900913:13\", \"13\"):\n                        w_status, w_ct, w_size, w_elapsed, w_detail = probe(client, WMTS_UPSTREAM, wmts_params(layer, 13, tile_x, tile_y, matrix))\n                        w_ok = w_status == 200 and w_ct.lower().startswith(\"image/\") and w_size > 100\n                        print(f\"GWC WMTS FALLBACK {'PASS' if w_ok else 'FAIL'} · {layer} · matrix={matrix} · HTTP={w_status} · CT={w_ct or '-'} · bytes={w_size} · {w_elapsed:.2f}s · {w_detail}\")\n                        if w_ok:\n                            wmts_ok = True\n                            break\n                    if wmts_ok:\n                        continue\n'''
          new_wmts_block = '''                    wmts_ok = False\n                    for wmts_url in WMTS_UPSTREAMS:\n                        for matrix in (\"EPSG:900913:13\", \"13\"):\n                            w_status, w_ct, w_size, w_elapsed, w_detail = probe(client, wmts_url, wmts_params(layer, 13, tile_x, tile_y, matrix))\n                            w_ok = w_status == 200 and w_ct.lower().startswith(\"image/\") and w_size > 100\n                            print(f\"GWC WMTS FALLBACK {'PASS' if w_ok else 'FAIL'} · {layer} · upstream={wmts_url} · matrix={matrix} · HTTP={w_status} · CT={w_ct or '-'} · bytes={w_size} · {w_elapsed:.2f}s · {w_detail}\")\n                            if w_ok:\n                                wmts_ok = True\n                                break\n                        if wmts_ok:\n                            break\n                    if wmts_ok:\n                        continue\n'''
          if old_wmts_block not in p:
              raise SystemExit('preflight WMTS block target not found')
          p = p.replace(old_wmts_block, new_wmts_block, 1)
          p = p.replace('''                    t_status, t_ct, t_size, t_elapsed, t_detail = probe(client, tms_url(layer, 13, tile_x, tile_y), {})\n                    t_ok = t_status == 200 and t_ct.lower().startswith(\"image/\") and t_size > 100\n                    print(f\"GWC TMS FALLBACK {'PASS' if t_ok else 'FAIL'} · {layer} · HTTP={t_status} · CT={t_ct or '-'} · bytes={t_size} · {t_elapsed:.2f}s · {t_detail}\")\n                    if t_ok:\n                        continue\n''', '''                    t_ok = False\n                    for t_url in tms_urls(layer, 13, tile_x, tile_y):\n                        t_status, t_ct, t_size, t_elapsed, t_detail = probe(client, t_url, {})\n                        one_ok = t_status == 200 and t_ct.lower().startswith(\"image/\") and t_size > 100\n                        print(f\"GWC TMS FALLBACK {'PASS' if one_ok else 'FAIL'} · {layer} · upstream={t_url} · HTTP={t_status} · CT={t_ct or '-'} · bytes={t_size} · {t_elapsed:.2f}s · {t_detail}\")\n                        if one_ok:\n                            t_ok = True\n                            break\n                    if t_ok:\n                        continue\n''', 1)
          marker = '''                u_status, u_ct, u_size, u_elapsed, u_detail = probe(client, UPSTREAM, untiled_wms_params(base, layer))\n'''
          root_block = '''                root_ok = False\n                for root_url in ROOT_WMS_UPSTREAMS:\n                    r_status, r_ct, r_size, r_elapsed, r_detail = probe(client, root_url, untiled_wms_params(base, layer))\n                    one_ok = r_status == 200 and r_ct.lower().startswith(\"image/\") and r_size > 100\n                    print(f\"ROOT WMS FALLBACK {'PASS' if one_ok else 'FAIL'} · {layer} · upstream={root_url} · HTTP={r_status} · CT={r_ct or '-'} · bytes={r_size} · {r_elapsed:.2f}s · {r_detail}\")\n                    if one_ok:\n                        root_ok = True\n                        break\n                if root_ok:\n                    continue\n\n'''
          if marker not in p:
              raise SystemExit('preflight untiled marker not found')
          p = p.replace(marker, root_block + marker, 1)
          pre.write_text(p)

          for path in (proxy, pre):
              text = path.read_text()
              if 'PLACEHOLDER' in text:
                  raise SystemExit(f'PLACEHOLDER remains in {path}')
          PY
          python -m py_compile urbion_wms_proxy.py
          python -m py_compile scripts/gis_upstream_preflight.py
          git diff --check
          grep -n "WMTS_UPSTREAMS\|ROOT_WMS_UPSTREAMS\|tms_urls\|_jmg_feature_image_fallback" urbion_wms_proxy.py scripts/gis_upstream_preflight.py
      - name: Commit repaired GIS paths and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_gis_deep_repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urbion_wms_proxy.py scripts/gis_upstream_preflight.py
          git commit -m "fix(gis): restore proven JMG fallback and align i-Plan preflight"
          git push origin HEAD:feature/canonical-workspace-v2
