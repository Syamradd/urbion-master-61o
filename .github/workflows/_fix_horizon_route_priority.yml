name: URBION One-Time Horizon Asset Route Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Put HORIZON UI asset ahead of catch-all frontend routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('championship_server.py')
          text = path.read_text(encoding='utf-8')
          old = '    "/urbion_p20506_live_evidence.js",\n    "/urbion_ui.js",'
          new = '    "/urbion_p20506_live_evidence.js",\n    "/urbion_championship_horizon_ui.js",\n    "/urbion_ui.js",'
          if old not in text:
              raise SystemExit('Expected priority anchor not found in championship_server.py')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit route fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_fix_horizon_route_priority.yml
          git add championship_server.py
          git commit -m "fix(ui): prioritize HORIZON asset route"
          git push origin HEAD:main
