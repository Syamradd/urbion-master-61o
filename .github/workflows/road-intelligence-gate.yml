name: URBION Road Intelligence Gate

on:
  push:
    branches:
      - feature/road-intelligence-v1
  pull_request:
    branches:
      - feature/canonical-workspace-v2

jobs:
  road-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Install test client
        run: pip install httpx playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start canonical presentation server
        run: |
          nohup python -m uvicorn landing_server:app --host 127.0.0.1 --port 8000 > /tmp/urbion-road-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/workspace >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/workspace >/dev/null
      - name: Run road intelligence integration smoke
        env:
          PYTHONPATH: .
        run: python scripts/road_intelligence_contract_smoke.py
      - name: Run workspace analysis visual smoke
        env:
          PYTHONPATH: .
          URBION_BASE_URL: http://127.0.0.1:8000
        run: python scripts/workspace_analysis_visual_smoke.py
