name: final-horizon-language-pointer-patch
on:
  push:
    branches: [fix/horizon-visual-rebase]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horizon-visual-rebase
          fetch-depth: 0
      - name: Patch final UI contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui=Path('urbion_championship_horizon_ui.js')
          s=ui.read_text(encoding='utf-8')
          anchor='body.horizon-ui .main-nav{position:relative!important;z-index:5!important;isolation:auto!important}\n'
          extra='''body.horizon-ui #cs-run,body.horizon-ui .workspace-actions .primary{scroll-margin-top:140px!important}\nbody.horizon-ui .workspace-head{scroll-margin-top:140px!important}\n'''
          if 'scroll-margin-top:140px!important' not in s:
              if anchor not in s:
                  raise SystemExit('pointer stack anchor not found')
              s=s.replace(anchor,anchor+extra,1)
          ui.write_text(s,encoding='utf-8')

          lang=Path('urbion_horizon_language_contract.js')
          s=lang.read_text(encoding='utf-8')
          anchor="  'Site / Project Full Name':'Nama Penuh Tapak / Projek','Latitude':'Latitud','Longitude':'Longitud','Plot Ratio':'Nisbah Plot',\n"
          extra="""  'Site / Project Full Name':'Nama Penuh Tapak / Projek','Latitude':'Latitud','Longitude':'Longitud','Plot Ratio':'Nisbah Plot',\n  'District / Daerah':'District','District':'Daerah','Pihak Berkuasa Tempatan (PBT)':'Local Authority (PBT)','Local Authority (PBT)':'Pihak Berkuasa Tempatan (PBT)',\n  'Guna Tanah 1 - Land Use':'Land Use 1','Guna Tanah 2 - Development Category':'Development Category','Guna Tanah 3 - Activity':'Activity',\n  'Guna Tanah 1 - Use':'Land Use 1','Guna Tanah 2 - Kategori Pemajuan':'Development Category','Guna Tanah 3 - Aktiviti':'Activity',\n  'Local Authority':'Pihak Berkuasa Tempatan','Planning case':'Kes perancangan','About Us':'Tentang Kami','Help':'Bantuan',\n"""
          if "'District / Daerah':'District'" not in s:
              if anchor not in s:
                  raise SystemExit('language vocabulary anchor not found')
              s=s.replace(anchor,extra,1)
          lang.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/_final_horizon_language_pointer_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urbion_championship_horizon_ui.js urbion_horizon_language_contract.js .github/workflows/_final_horizon_language_pointer_patch.yml
          git commit -m "fix(ui): finalize EN-BM vocabulary and sticky action scrolling"
          git push origin HEAD:fix/horizon-visual-rebase
