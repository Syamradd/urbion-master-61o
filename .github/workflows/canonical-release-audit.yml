name: URBION Canonical Release Audit

on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout canonical release branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Release gate audit
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_release_gate_audit.py

      - name: Full regression
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start canonical presentation server
        env:
          PYTHONPATH: .
          PORT: 8765
        run: |
          set -euo pipefail
          python -m uvicorn landing_server:app --host 0.0.0.0 --port "$PORT" >/tmp/urbion.log 2>&1 &
          PID=$!
          echo "$PID" > /tmp/urbion.pid
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/urbion.log
          exit 1

      - name: Canonical GIS upstream/proxy preflight
        if: always()
        env:
          PYTHONPATH: .
          URBION_BASE_URL: http://127.0.0.1:8765
        run: python scripts/gis_upstream_preflight.py

      - name: Canonical runtime topology smoke
        env:
          PYTHONPATH: .
          URBION_BASE_URL: http://127.0.0.1:8765
        run: python scripts/canonical_runtime_topology_smoke.py

      - name: Deep browser functional smoke
        if: always()
        env:
          PYTHONPATH: .
          URBION_BASE_URL: http://127.0.0.1:8765
          URBION_ARTIFACT_DIR: artifacts/canonical-release-browser
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/workspace_browser_smoke_ci.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              'page.wait_for_function("document.body.innerText.includes(\'ANALYSIS COMPLETE\')", timeout=20000)',
              'page.wait_for_function("!!window.URBION_LAST", timeout=60000)',
          )
          s = s.replace(
              'page.wait_for_function("document.body.innerText.includes(\'ANALYSIS COMPLETE\')",timeout=20000)',
              'page.wait_for_function("!!window.URBION_LAST",timeout=60000)',
          )
          p.write_text(s, encoding="utf-8")
          PY
          python scripts/workspace_browser_smoke_ci.py 2>&1 | tee /tmp/urbion-browser.log
          if grep -q '^CHECK FAILURES:' /tmp/urbion-browser.log; then
            echo 'Deep browser smoke emitted check failures; failing gate.'
            exit 1
          fi

      - name: 25-layer end-to-end GIS render audit
        if: always()
        env:
          PYTHONPATH: .
          URBION_BASE_URL: http://127.0.0.1:8765
        run: python scripts/gis_layer_regression.py

      - name: Upload canonical browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urbion-canonical-release-browser-evidence
          path: artifacts/canonical-release-browser/
          if-no-files-found: ignore
