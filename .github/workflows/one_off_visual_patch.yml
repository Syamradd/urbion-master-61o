name: URBION one-off visual repair
on:
  push:
    branches:
      - fix/championship-visual-flow-v1
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[visual-auto-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual and entry-flow repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('championship_server.py')
          text = root.read_text(encoding='utf-8')

          old = 'if request.url.path in {"/", "/index.html", "/championship.html"}:'
          new = 'if request.url.path == "/championship.html":'
          if old not in text:
              raise SystemExit('root route override pattern not found')
          text = text.replace(old, new, 1)

          marker = '    "urbion_horizon_language_contract.js",\n}'
          addition = '    "urbion_horizon_language_contract.js",\n    "urbion_championship_visual_system_v1.js",\n}'
          if marker not in text:
              raise SystemExit('allowed asset marker not found')
          text = text.replace(marker, addition, 1)

          old_script = '  <script src="/urbion_championship_horizon_ui.js"></script>\n  <style id="horizon-workspace-h1-visual-contract">'
          new_script = '  <script src="/urbion_championship_horizon_ui.js"></script>\n  <script src="/urbion_championship_visual_system_v1.js"></script>\n  <style id="horizon-workspace-h1-visual-contract">'
          if old_script not in text:
              raise SystemExit('frontend script insertion point not found')
          text = text.replace(old_script, new_script, 1)
          root.write_text(text, encoding='utf-8')

          visual = Path('urbion_championship_visual_system_v1.js')
          visual.write_text(r'''(()=>{
