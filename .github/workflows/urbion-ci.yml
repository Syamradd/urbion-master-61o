name: URBION CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    name: regression-${{ matrix.lane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [core, frontend, mapping, planning, judge, spatial, station, impact, policy, recommendation, lcp, redteam]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run lane
        env:
          PYTHONPATH: .
        run: |
          case "${{ matrix.lane }}" in
            core) python -m pytest -q tests/test_spatial_input_guard.py tests/test_km_endpoint_contract.py tests/test_kebenaran_merancang.py ;;
            frontend) python -m pytest -q tests/test_live_frontend_contract.py tests/test_ui_controller_contract.py tests/test_decision_center_contract.py tests/test_master171_evidence_ui.py tests/test_master172_what_if_delta.py tests/test_planner_review_contract.py tests/test_master174_planner_actions.py ;;
            mapping) python -m pytest -q tests/test_map_studio_contract.py tests/test_master170_controls.py tests/test_hydrology_source.py ;;
            planning) python -m pytest -q tests/test_master173_km_planner_surface.py tests/test_km_endpoint_contract.py ;;
            judge) python -m pytest -q tests/test_master175_release_gate.py tests/test_decision_center_contract.py tests/test_master171_evidence_ui.py tests/test_master172_what_if_delta.py ;;
            spatial) python -m pytest -q tests/test_master183_spatial_sources.py tests/test_master183_multi_source_helpers.py tests/test_master183_decision_spatial_surface.py ;;
            station) python -m pytest -q tests/test_master184_station_intelligence.py tests/test_master184_endpoint_contract.py ;;
            impact) python -m pytest -q tests/test_master185_development_impact.py ;;
            policy) python -m pytest -q tests/test_master186_policy_graph.py ;;
            recommendation) python -m pytest -q tests/test_master187_recommendations.py ;;
            lcp) python -m pytest -q tests/test_master188_lcp_intelligence.py tests/test_master188_lcp_endpoint.py tests/test_master189_integration_ui.py ;;
            redteam) python -m pytest -q tests/test_master190_red_team.py ;;
          esac

  full:
    name: full-regression
    runs-on: ubuntu-latest
    needs: regression
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full regression suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q
