name: URBION CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify source tree
        run: python -c "import os; print(os.getcwd()); print(os.listdir('.')); assert os.path.exists('server.py')"
      - name: Run regression suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q
