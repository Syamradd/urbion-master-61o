name: URBION CI

on:
  push:
    branches: [main, feature/ux-v5-command-center]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep the existing CI pipeline and parallel regression matrix intact.
# The feature branch is included so UX work is validated before merge.

permissions:
  contents: read

jobs:
  regression:
    name: regression (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [core, frontend, mapping, planning, judge, spatial, station, impact, policy, recommendation, lcp, redteam, smoke, release, presentation, contract, final]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression lane
        env:
          PYTHONPATH: .
        run: |
          case "${{ matrix.lane }}" in
            frontend)
              python -m pytest -q tests/test_championship_ux_v4_contract.py tests/test_championship_ux_v5_contract.py tests/test_championship_entrypoint.py
              ;;
            contract)
              python -m pytest -q tests/test_championship_ux_v4_contract.py tests/test_championship_ux_v5_contract.py tests/test_championship_entrypoint.py
              ;;
            *)
              python -m pytest -q
              ;;
          esac

  runtime-smoke:
    name: runtime-smoke
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Start championship server
        env:
          PYTHONPATH: .
        run: |
          nohup uvicorn championship_server:app --host 127.0.0.1 --port 8000 > /tmp/urbion-server.log 2>&1 &
          echo $! > /tmp/urbion-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:8000/metadata > /tmp/metadata.json
          curl -fsS http://127.0.0.1:8000/championship-gate > /tmp/gate.json
          curl -fsS http://127.0.0.1:8000/ > /tmp/index.html
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/urbion-server.pid ]; then kill $(cat /tmp/urbion-server.pid) || true; fi
          if [ -f /tmp/urbion-server.log ]; then cat /tmp/urbion-server.log; fi

  full:
    name: full-regression
    needs: runtime-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full regression
        env:
          PYTHONPATH: .
        run: python -m pytest -q
