name: URBION CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    name: regression-${{ matrix.lane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [core, frontend, mapping, planning, judge, spatial, station, impact, policy, recommendation, lcp, redteam, smoke, release, presentation, contract, final]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run lane
        env:
          PYTHONPATH: .
        run: |
          case "${{ matrix.lane }}" in
            core) python -m pytest -q tests/test_spatial_input_guard.py tests/test_km_endpoint_contract.py tests/test_kebenaran_merancang.py tests/test_master_hardening_scoring.py ;;
            frontend) python -m pytest -q tests/test_live_frontend_contract.py tests/test_ui_controller_contract.py tests/test_decision_center_contract.py tests/test_master171_evidence_ui.py tests/test_master172_what_if_delta.py tests/test_what_if_frontend_contract.py tests/test_planner_review_contract.py tests/test_master174_planner_actions.py tests/test_master_decision_rendering.py tests/test_master_decision_center_workstation.py tests/test_master308_input_sync.py tests/test_master309_unified_assessment_state.py tests/test_master312_workflow.py tests/test_master313_workflow_engine.py tests/test_master314_intelligence_ui.py tests/test_master322_spatial_workstation.py test_championship_entrypoint.py ;;
            mapping) python -m pytest -q tests/test_map_studio_contract.py tests/test_master170_controls.py tests/test_hydrology_source.py tests/test_master_map_layer_renderability.py ;;
            planning) python -m pytest -q tests/test_master173_km_planner_surface.py tests/test_km_endpoint_contract.py ;;
            judge) python -m pytest -q tests/test_master175_release_gate.py tests/test_decision_center_contract.py tests/test_master171_evidence_ui.py tests/test_master172_what_if_delta.py tests/test_what_if_frontend_contract.py tests/test_master192_judge_run.py tests/test_master308_input_sync.py tests/test_master309_unified_assessment_state.py ;;
            spatial) python -m pytest -q tests/test_master183_spatial_sources.py tests/test_master183_multi_source_helpers.py tests/test_master183_decision_spatial_surface.py ;;
            station) python -m pytest -q tests/test_master184_station_intelligence.py tests/test_master184_endpoint_contract.py ;;
            impact) python -m pytest -q tests/test_master185_development_impact.py ;;
            policy) python -m pytest -q tests/test_master186_policy_graph.py ;;
            recommendation) python -m pytest -q tests/test_master187_recommendations.py ;;
            lcp) python -m pytest -q tests/test_master188_lcp_intelligence.py tests/test_master188_lcp_endpoint.py tests/test_master189_integration_ui.py tests/test_master199_integrated_decision_orchestration.py ;;
            redteam) python -m pytest -q tests/test_master190_red_team.py tests/test_master196_integrity_gate.py ;;
            smoke) python -m pytest -q tests/test_master191_deployment_smoke.py ;;
            release) python -m pytest -q tests/test_master193_release_lock.py tests/test_master194_release_candidate.py tests/test_master194_visual_function.py tests/test_master195_release_packet.py ;;
            presentation) python -m pytest -q tests/test_master197_presentation_ready.py ;;
            contract) python -m pytest -q tests/test_master202_championship_contract.py ;;
            final) python -m pytest -q tests/test_master198_final_acceptance.py tests/test_master202_championship_contract.py ;;
          esac

  runtime-smoke:
    name: runtime-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Launch Render-equivalent Uvicorn command
        env:
          PYTHONPATH: .
          PORT: 8765
        run: |
          set -euo pipefail
          python -m uvicorn championship_server:app --host 0.0.0.0 --port "$PORT" > /tmp/urbion-uvicorn.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json, time, urllib.error, urllib.request
          base = 'http://127.0.0.1:8765'
          endpoints = ['/health', '/metadata', '/championship-gate', '/']
          last_error = None
          for _ in range(30):
              try:
                  for path in endpoints:
                      with urllib.request.urlopen(base + path, timeout=3) as response:
                          body = response.read()
                          if response.status != 200 or not body:
                              raise RuntimeError(f'{path}: unexpected HTTP {response.status}')
                          if path != '/' and path != '/health':
                              json.loads(body.decode('utf-8'))
                          if path == '/':
                              html = body.decode('utf-8')
                              assert 'URBION HORIZON — Championship Workstation' in html
                              assert 'id="urbion-championship"' in html
                              assert 'Site + Development Inputs' not in html
                  with urllib.request.urlopen(base + '/health', timeout=3) as response:
                      health = json.loads(response.read().decode('utf-8'))
                  assert health['status'] == 'healthy'
                  assert health['engine'] == 'URBION PHASE-E.7'
                  print('RUNTIME_SMOKE_OK')
                  raise SystemExit(0)
              except (urllib.error.URLError, TimeoutError, RuntimeError, AssertionError, json.JSONDecodeError) as exc:
                  last_error = exc
                  time.sleep(1)
          print(open('/tmp/urbion-uvicorn.log', encoding='utf-8').read())
          raise SystemExit(f'Runtime smoke failed: {last_error}')
          PY

  full:
    name: full-regression
    runs-on: ubuntu-latest
    needs: regression
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full regression suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q