name: URBION One-Time JMG IDs Probe
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install httpx
        run: python -m pip install 'httpx<1.0,>=0.27'
      - name: Probe Major Fault ids-only then geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import httpx, time, json
          bbox='11349369.95978297,195678.7924100496,11388505.718264982,234814.55089206249'
          url='https://mygems.jmg.gov.my/server/rest/services/GeologiAsas/Major_Fault/FeatureServer/5/query'
          H={'User-Agent':'URBION-JMG-IDS/1.0','Referer':'https://mygems.jmg.gov.my/','Accept':'application/json,*/*;q=0.8','Connection':'close'}
          common={'where':'1=1','geometry':bbox,'geometryType':'esriGeometryEnvelope','inSR':'3857','spatialRel':'esriSpatialRelIntersects','f':'json','resultType':'tile'}
          with httpx.Client(timeout=httpx.Timeout(25.0,connect=8.0),follow_redirects=True,headers=H) as c:
              for name,p in [
                ('ids-only',{**common,'returnIdsOnly':'true'}),
                ('count-only',{**common,'returnCountOnly':'true'}),
                ('ids-nogeom',{**common,'returnIdsOnly':'true','returnGeometry':'false'}),
              ]:
                  t=time.perf_counter()
                  try:
                      r=c.get(url,params=p)
                      print(f'{name}: HTTP={r.status_code} CT={r.headers.get("content-type","")} bytes={len(r.content)} elapsed={time.perf_counter()-t:.2f}s')
                      print(r.text[:3000].replace('\\n',' ').replace('\\r',' '))
                  except Exception as e:
                      print(f'{name}: ERROR={type(e).__name__} elapsed={time.perf_counter()-t:.2f}s detail={e}')
          PY
      - name: Remove ids probe
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_jmg_ids_probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time JMG IDs probe"
          git push origin HEAD:feature/canonical-workspace-v2
