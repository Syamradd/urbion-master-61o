name: One-time Theme Handler Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'Syamradd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact theme handler hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('urbion_championship_command_shell.js')
          s = p.read_text(encoding='utf-8')
          old = "$('#cs-theme').onclick=()=>{const light=!document.documentElement.classList.contains('cs-light');document.documentElement.classList.toggle('cs-light',light);localStorage.setItem('urbion-theme',light?'light':'dark');applyTheme()}"
          new = "$('#cs-theme').onclick=()=>{const light=!document.documentElement.classList.contains('cs-light');localStorage.setItem('urbion-theme',light?'light':'dark');document.documentElement.classList.toggle('cs-light',light);const l=$('#cs-logo');if(l)l.src=light?'/urbion_logo_light.svg':'/urbion_logo_dark.svg'}"
          if old not in s:
              print('Theme handler already repaired or pattern changed; no source mutation needed.')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Applied exact theme handler hardening.')
          PY
      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-theme-handler-once.yml
          if git diff --quiet -- urbion_championship_command_shell.js; then
            git commit -m 'chore(repair): remove one-time theme repair workflow'
          else
            git add urbion_championship_command_shell.js
            git commit -m 'fix(runtime): harden theme toggle state persistence'
          fi
          git push origin HEAD:main