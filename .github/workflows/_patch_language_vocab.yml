name: patch-horizon-language-vocabulary
on:
  push:
    branches: [fix/horizon-visual-rebase]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horizon-visual-rebase
          fetch-depth: 0
      - name: Extend planning vocabulary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('urbion_horizon_language_contract.js')
          s=p.read_text(encoding='utf-8')
          anchor="  'Project Reference':'Rujukan Projek','Site / Parcel':'Tapak / Lot','Lot / UPI Reference':'Rujukan Lot / UPI',\n"
          extra="  'Project Reference':'Rujukan Projek','Site / Parcel':'Tapak / Lot','Lot / UPI Reference':'Rujukan Lot / UPI',\n  'Site / Project Full Name':'Nama Penuh Tapak / Projek','Latitude':'Latitud','Longitude':'Longitud','Plot Ratio':'Nisbah Plot',\n  'Project or site name':'Nama projek atau tapak','e.g. 4.5':'contoh 4.5','Select PBT':'Pilih PBT','Select district':'Pilih daerah',\n"
          if anchor not in s:
              raise SystemExit('language vocabulary anchor not found')
          s=s.replace(anchor,extra,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/_patch_language_vocab.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urbion_horizon_language_contract.js .github/workflows/_patch_language_vocab.yml
          git commit -m "fix(ui): complete common EN-BM vocabulary"
          git push origin HEAD:fix/horizon-visual-rebase
