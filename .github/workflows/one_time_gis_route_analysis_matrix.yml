name: URBION One-Time GIS Route and Analysis Matrix
on:
  push:
    branches: [feature/canonical-workspace-v2]
  workflow_dispatch:
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-workspace-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Start canonical server
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m uvicorn landing_server:app --host 127.0.0.1 --port 8765 >/tmp/urbion-matrix.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/health >/dev/null
      - name: Official GIS route matrix
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, math, time, httpx
          from urllib.parse import quote
          layers=['iplan:rsn','iplan:warisan','iplan:rumah_mampu_milik','iplan:topo']
          bbox='11349369.959782971,234814.5508920622,11388505.71826498,273950.3093740722'
          xmin,ymin,xmax,ymax=map(float,bbox.split(',')); world=20037508.342789244
          z=13; span=2*world/(2**z); x=int(math.floor((xmin+world)/span)); y_xyz=int(math.floor((world-ymax)/span)); y_tms=(2**z-1)-y_xyz
          async def probe(client,label,url,params=None):
              t=time.perf_counter()
              try:
                  r=await client.get(url,params=params or {},timeout=httpx.Timeout(10.0,connect=4.0))
                  ct=r.headers.get('content-type',''); body=''
                  if r.status_code>=400 or not ct.lower().startswith('image/'):
                      body=r.text[:240].replace('\n',' ').replace('\r',' ')
                  return label,r.status_code,ct,len(r.content),time.perf_counter()-t,body,str(r.url)
              except Exception as e:
                  return label,0,'',0,time.perf_counter()-t,repr(e),url
          jobs=[]
          for layer in layers:
              p={'service':'WMS','request':'GetMap','layers':layer,'styles':'','format':'image/png','transparent':'true','version':'1.1.1','tiled':'true','width':'256','height':'256','srs':'EPSG:900913','bbox':bbox}
              jobs.append(('GWC-WMS '+layer,'https://iplan.planmalaysia.gov.my/geoserver/gwc/service/wms',p))
              p2=dict(p); p2.pop('tiled',None)
              jobs.append(('ROOT-WMS '+layer,'https://iplan.planmalaysia.gov.my/geoserver/service/wms',p2))
              jobs.append(('DIRECT-WMS '+layer,'https://iplan.planmalaysia.gov.my/geoserver/iplan/wms',p2))
              for base in ('https://iplan.planmalaysia.gov.my/geoserver/gwc/service/tms/1.0.0','https://iplan.planmalaysia.gov.my/geoserver/service/tms/1.0.0'):
                  enc=quote(layer,safe=':')
                  jobs.append((f'TMS {layer} {base.split("/")[4]}',f'{base}/{enc}@EPSG:900913@png/{z}/{x}/{y_tms}.png',{}))
              for base in ('https://iplan.planmalaysia.gov.my/geoserver/gwc/service/wmts','https://iplan.planmalaysia.gov.my/geoserver/service/wmts'):
                  for matrix in (f'EPSG:900913:{z}',str(z)):
                      jobs.append((f'WMTS {layer} {base.split("/")[4]} {matrix}',base,{'SERVICE':'WMTS','REQUEST':'GetTile','VERSION':'1.0.0','LAYER':layer,'STYLE':'default','FORMAT':'image/png','TILEMATRIXSET':'EPSG:900913','TILEMATRIX':matrix,'TILEROW':str(y_xyz),'TILECOL':str(x)}))
          async def main():
              limits=httpx.Limits(max_connections=20,max_keepalive_connections=5)
              async with httpx.AsyncClient(follow_redirects=True,limits=limits,headers={'User-Agent':'URBION-HORIZON-Forensic/1.0','Referer':'https://iplan.planmalaysia.gov.my/geoserver/demo','Accept':'image/png,image/*,*/*;q=0.8','Connection':'close'}) as c:
                  results=await asyncio.gather(*(probe(c,*job) for job in jobs))
              for row in results:
                  print('GIS_MATRIX | %s | HTTP=%s | CT=%s | bytes=%s | %.2fs | %s | %s' % row)
          asyncio.run(main())
          PY
      - name: Raw workstation analysis timing
        shell: bash
        run: |
          python - <<'PY'
          import time, json, urllib.request
          payload={
            'site_lat':2.285,'site_lon':102.196,'tod_lat':2.286,'tod_lon':102.196,
            'plot_ratio':4.5,'precinct':'Terminal Sg. Udang','development_type':'TOD Development / Mixed Use',
            'development_class':'Mixed Use','state':'Melaka','district':'Melaka Tengah',
            'pbt':'Majlis Bandaraya Melaka Bersejarah','lot_no':''
          }
          req=urllib.request.Request('http://127.0.0.1:8765/workstation/analysis',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          t=time.perf_counter()
          try:
              with urllib.request.urlopen(req,timeout=150) as r:
                  body=r.read(); print('ANALYSIS_HTTP',r.status,'bytes',len(body),'elapsed',round(time.perf_counter()-t,2))
          except Exception as e:
              print('ANALYSIS_EXCEPTION',repr(e),'elapsed',round(time.perf_counter()-t,2))
          PY
      - name: Print server trace
        shell: bash
        run: |
          echo '===== URBION SERVER TRACE ====='
          tail -n 500 /tmp/urbion-matrix.log || true
      - name: Remove forensic workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_gis_route_analysis_matrix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: remove one-time GIS forensic workflow"
          git push origin HEAD:feature/canonical-workspace-v2
